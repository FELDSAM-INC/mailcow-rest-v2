description: |
  Pagination metadata of the queue listing, with the queue's size. The listing covers at most the
  first 10,000 messages Postfix reports, as legacy does; `truncated` says when Postfix reported
  more. `queueCounts` counts every message Postfix reported, independent of filters, paging and
  the 10,000 limit. Whole-queue actions (flush, delete all) always affect every message.
allOf:
  - $ref: './ListMeta.yaml'
  - type: object
    required: [truncated, queueCounts]
    properties:
      truncated:
        type: boolean
        description: '`true` when Postfix reported more than 10,000 messages.'
      queueCounts:
        type: object
        required: [active, deferred, hold, incoming, maildrop, total]
        properties:
          active:
            type: integer
            minimum: 0
          deferred:
            type: integer
            minimum: 0
          hold:
            type: integer
            minimum: 0
          incoming:
            type: integer
            minimum: 0
          maildrop:
            type: integer
            minimum: 0
          total:
            type: integer
            minimum: 0
            description: Every queued message Postfix reported.
        additionalProperties: false
