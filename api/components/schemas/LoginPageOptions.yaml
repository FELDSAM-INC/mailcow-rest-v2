type: object
description: Login page options (`CUSTOM_LOGIN`). All default to `false`.
required: [hideAdminLogin, hideDomainAdminLogin, hideMailboxUserLogin, forceSingleSignOn]
properties:
  hideAdminLogin:
    type: boolean
    description: Hide the administrator login link (`hide_admin_quicklink`).
  hideDomainAdminLogin:
    type: boolean
    description: Hide the domain administrator login link (`hide_domainadmin_quicklink`).
  hideMailboxUserLogin:
    type: boolean
    description: Hide the mailbox user login link (`hide_user_quicklink`).
  forceSingleSignOn:
    type: boolean
    description: |
      Legacy hides the password form in favour of identity-provider sign-in (`force_sso`). When it
      is set and `externalIdentityProvider.singleSignOnAvailable` is `true`, clients offer single
      sign-on instead of the password form on the mailbox-user sign-in screen and keep passkey
      sign-in. Display-only: the API refuses no sign-in method because of it (feature 012).
