put:
  operationId: setRspamdUiPassword
  tags: [Rspamd settings]
  summary: Set the Rspamd web interface password
  description: |
    Hands the new password to mailcow's container service, which stores its hash for Rspamd and
    restarts Rspamd, as legacy does. The answer is `204` only once the service confirms it. The
    password is never stored, logged, audited or returned by this API; the audit record only says
    that it was changed.

    Only a signed-in administrator may set it. Requests authenticated by an API key are refused with
    `session-required`, whatever the key's owner and access level, so that a leaked key cannot lock
    administrators out of the Rspamd web interface.
  security:
    - sessionCookie: []
      csrfToken: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/RspamdUiPasswordRequest.yaml'
  responses:
    '204':
      $ref: '../../components/responses/NoContent.yaml'
    '400':
      $ref: '../../components/responses/BadRequest.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/Forbidden.yaml'
    '422':
      $ref: '../../components/responses/ValidationFailed.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
    '502':
      $ref: '../../components/responses/RspamdUiPasswordServiceFailure.yaml'
    '504':
      $ref: '../../components/responses/RspamdUiPasswordOutcomeUnknown.yaml'
