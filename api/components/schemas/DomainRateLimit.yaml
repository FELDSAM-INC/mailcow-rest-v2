type: object
description: |
  A rate limit: at most `value` messages per `frame`. mailcow stores it in its shared store
  (`RL_VALUE`, for example `10 / 1h`).
required: [value, frame]
properties:
  value:
    type: integer
    minimum: 1
    maximum: 2147483647
    description: Number of messages.
  frame:
    type: string
    enum: [second, minute, hour, day]
    description: Time frame (legacy `s`, `m`, `h`, `d`).
