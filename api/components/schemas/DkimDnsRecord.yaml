type: object
description: |
  The DNS TXT record a DKIM key needs. Publish it in the domain's zone so that receivers can verify
  the signatures.
required: [name, type, value, valueParts]
properties:
  name:
    type: string
    description: Fully qualified record name `<selector>._domainkey.<name>`, without a trailing dot.
    examples: [dkim._domainkey.example.org]
  type:
    type: string
    const: TXT
  value:
    type: string
    description: The record value as one text, `v=DKIM1;k=rsa;t=s;s=email;p=<public key>`.
    examples: ['v=DKIM1;k=rsa;t=s;s=email;p=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA...']
  valueParts:
    type: array
    minItems: 1
    description: |
      The same value split into consecutive pieces of at most 255 characters, for DNS providers that
      need the character strings of a TXT record entered separately. Joined, they equal `value`.
    items:
      type: string
      minLength: 1
      maxLength: 255
