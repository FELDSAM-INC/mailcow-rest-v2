type: object
required: [sessionsEnded, activeAppPasswords, mailServerCacheSeconds]
properties:
  sessionsEnded:
    type: integer
    minimum: 0
    description: Number of the account's other sessions of this API that were ended.
  activeAppPasswords:
    type: integer
    minimum: 0
    description: Active app passwords of the mailbox, which keep working (always 0 for administrator accounts).
  mailServerCacheSeconds:
    type: integer
    minimum: 0
    description: |
      The mail server may accept the old password from mail clients for up to this many seconds
      (its credential cache period), as after a change in the legacy UI.
    examples: [300]
