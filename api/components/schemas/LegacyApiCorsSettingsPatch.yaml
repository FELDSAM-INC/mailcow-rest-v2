type: object
description: |
  JSON Merge Patch of the legacy API's CORS settings. Lists replace the stored lists. Each origin is
  `*` or `scheme://host[:port]` with the scheme `http` or `https`, a valid host name or IP address
  (IPv6 in brackets), and no path, query, fragment or credentials (rule code `invalidFormat`,
  `format: origin`). Origins are stored in lower case and once each. The resulting settings are
  validated as a whole, so a stored invalid origin must be replaced in the same request.
minProperties: 1
additionalProperties: false
properties:
  allowedOrigins:
    type: array
    maxItems: 100
    items:
      type: string
      maxLength: 2048
  allowedMethods:
    type: array
    minItems: 1
    maxItems: 4
    items:
      type: string
      enum: [GET, POST, PUT, DELETE]
