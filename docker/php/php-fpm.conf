; mailcow REST API v2 php-fpm pool (research R1, R23). Loaded after the image's zz-docker.conf.
[www]
; A bare port listens on IPv6 and IPv4 (falling back to IPv4 alone without IPv6): mailcow's
; network has IPv6, and nginx tries the container's IPv6 address first.
listen = 9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
access.log = /dev/null
