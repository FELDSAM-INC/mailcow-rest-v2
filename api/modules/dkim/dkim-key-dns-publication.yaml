parameters:
  - $ref: '../../components/parameters/DkimName.yaml'
post:
  operationId: publishDkimDnsRecord
  tags: [DKIM]
  summary: Publish a DKIM record to ISPConfig again
  description: |
    FeldHost DKIM DNS publication: publishes the record of the name's current key to the ISPConfig
    zone whose origin is exactly the name, with the same steps and outcomes as after a key change,
    for example after a failed publication. It changes the DNS zone, so read-only keys are refused.
    Administrators only. A name without a key answers `404`. While the publication is disabled (the
    default), `403` with type `/api/v2/problems/dkim-dns-publication-disabled`. The key itself is
    unchanged. Audited with the outcome.
  security:
    - sessionCookie: []
      csrfToken: []
    - apiKeyAuth: []
  parameters:
    - $ref: '../../components/parameters/IfMatch.yaml'
  responses:
    '200':
      $ref: '../../components/responses/DkimKeyChangedResponse.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/DkimDnsPublicationForbidden.yaml'
    '404':
      $ref: '../../components/responses/NotFound.yaml'
    '412':
      $ref: '../../components/responses/PreconditionFailed.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
    '503':
      $ref: '../../components/responses/DkimTemporaryFailure.yaml'
