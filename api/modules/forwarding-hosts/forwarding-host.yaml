parameters:
  - $ref: '../../components/parameters/ForwardingHostAddress.yaml'
get:
  operationId: getForwardingHost
  tags: [Forwarding hosts]
  summary: Get a forwarding host
  description: Returns one forwarding host by its stored address, with its version tag. Administrators only.
  security:
    - sessionCookie: []
    - apiKeyAuth: []
  responses:
    '200':
      $ref: '../../components/responses/ForwardingHostResponse.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/Forbidden.yaml'
    '404':
      $ref: '../../components/responses/NotFound.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
    '503':
      $ref: '../../components/responses/RoutingTemporaryFailure.yaml'
patch:
  operationId: updateForwardingHost
  tags: [Forwarding hosts]
  summary: Change a forwarding host's spam filter
  description: |
    Enables or disables the spam filter of the entry. With it disabled, spam from the host is
    accepted and delivered like other mail. The address and the source are read-only.
    Administrators only. Audited.
  security:
    - sessionCookie: []
      csrfToken: []
    - apiKeyAuth: []
  parameters:
    - $ref: '../../components/parameters/IfMatch.yaml'
  requestBody:
    required: true
    content:
      application/merge-patch+json:
        schema:
          $ref: '../../components/schemas/ForwardingHostPatch.yaml'
  responses:
    '200':
      $ref: '../../components/responses/ForwardingHostResponse.yaml'
    '400':
      $ref: '../../components/responses/BadRequest.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/Forbidden.yaml'
    '404':
      $ref: '../../components/responses/NotFound.yaml'
    '412':
      $ref: '../../components/responses/PreconditionFailed.yaml'
    '415':
      $ref: '../../components/responses/UnsupportedMediaType.yaml'
    '422':
      $ref: '../../components/responses/ValidationFailed.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
    '503':
      $ref: '../../components/responses/RoutingTemporaryFailure.yaml'
delete:
  operationId: deleteForwardingHost
  tags: [Forwarding hosts]
  summary: Delete a forwarding host
  description: |
    Removes the address and its spam filter setting together. Administrators only. Audited.
  security:
    - sessionCookie: []
      csrfToken: []
    - apiKeyAuth: []
  parameters:
    - $ref: '../../components/parameters/IfMatch.yaml'
  responses:
    '204':
      $ref: '../../components/responses/NoContent.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/Forbidden.yaml'
    '404':
      $ref: '../../components/responses/NotFound.yaml'
    '412':
      $ref: '../../components/responses/PreconditionFailed.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
    '503':
      $ref: '../../components/responses/RoutingTemporaryFailure.yaml'
