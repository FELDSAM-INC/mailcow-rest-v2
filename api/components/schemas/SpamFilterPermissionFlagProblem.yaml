description: |
  Problem of type `/api/v2/problems/permission-flag-required` (status `403`): the caller's role
  may use the operation, but only with a permission flag (`user_acl` or `da_acl`) it lacks. Nothing
  was changed. The whole-message download needs two flags for mailbox users; when both are
  missing, `requiredFlags` names `quarantine` first, and `quarantineAttachments` once
  `quarantine` is held.
allOf:
  - $ref: './PermissionFlagRequiredProblem.yaml'
  - type: object
    required: [requiredFlags]
    properties:
      requiredFlags:
        type: array
        minItems: 1
        description: |
          Flags named as in `PermissionFlags`; any one of them would allow the operation. Feature
          006 uses `quarantine`, `quarantineAttachments`, `spamScore`, `spamPolicy` and `ratelimit`.
        items:
          type: string
          examples: [quarantine, quarantineAttachments, spamPolicy, ratelimit]
