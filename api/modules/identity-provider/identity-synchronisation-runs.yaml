post:
  operationId: requestIdentitySyncRun
  tags:
  - Identity provider
  summary: Queue an identity preview or sync run for the upstream cron
  description: 'Administrators only. Requires mailcow 2026-11 for writes. Read-only
    API keys may read. Preview does not apply changes. Force bypasses removal limits
    and requires confirmForce: true. An identical pending run is reused.'
  security:
  - sessionCookie: []
    csrfToken: []
  - apiKeyAuth: []
  responses:
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '500':
      $ref: ../../components/responses/InternalError.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '412':
      $ref: ../../components/responses/PreconditionFailed.yaml
    '415':
      $ref: ../../components/responses/UnsupportedMediaType.yaml
    '422':
      $ref: ../../components/responses/ValidationFailed.yaml
    '409':
      description: The configured provider or installed schema does not support synchronisation.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/Problem.yaml
    '202':
      description: The requested data.
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: ../../components/schemas/IdentitySyncRun.yaml
            additionalProperties: false
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
          - mode
          properties:
            mode:
              type: string
              enum:
              - preview
              - run
              - force
            confirmForce:
              type: boolean
          additionalProperties: false
