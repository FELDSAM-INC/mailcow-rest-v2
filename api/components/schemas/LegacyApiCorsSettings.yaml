type: object
description: |
  The CORS settings of the legacy `/api/v1` (`CORS_SETTINGS`). They govern only the legacy API:
  this API does not answer cross-origin requests. Origins written by older releases as bare host
  names are returned as stored and must be corrected before the settings can be saved again.
required: [allowedOrigins, allowedMethods, serverOrigin, etag]
properties:
  allowedOrigins:
    type: array
    description: |
      Stored origins, `*` allowing every origin. Empty means only `serverOrigin`, as in legacy.
    items:
      type: string
    examples: [['https://portal.example.org', '*']]
  allowedMethods:
    type: array
    minItems: 1
    items:
      type: string
      enum: [GET, POST, PUT, DELETE]
  serverOrigin:
    type: string
    description: The server's own origin, used while `allowedOrigins` is empty.
    examples: ['https://mail.example.org']
  etag:
    type: string
    description: Version tag of the stored settings, equal to the `ETag` header.
