get:
  operationId: getBrandColors
  tags: [Branding settings]
  summary: Get the brand colours
  description: |
    Returns the stored light and dark brand colours and the colours in effect, with their
    foregrounds. The colours are stored by this API only; the legacy UI does not show them. Administrators only, by session or by an administrator's key, read-only keys included.
  security:
    - sessionCookie: []
    - apiKeyAuth: []
  responses:
    '200':
      $ref: '../../components/responses/BrandColorsResponse.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/Forbidden.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
    '503':
      $ref: '../../components/responses/SettingsTemporaryFailure.yaml'
patch:
  operationId: updateBrandColors
  tags: [Branding settings]
  summary: Change the brand colours
  description: |
    Sets or clears (`null`) the light and dark brand colours. A light colour needs a WCAG 2.2
    contrast ratio of at least 4.5:1 against `#ffffff`, a dark colour against `#1d2939`; a colour that
    fails is refused with `insufficientContrast` and its measured ratio. Colours are stored in lower
    case. Clearing both returns the web app to its own palette. Refused in demo mode. Audited with the
    old and new colours. The colours in effect appear in the public configuration on its next read.
  security:
    - sessionCookie: []
      csrfToken: []
    - apiKeyAuth: []
  parameters:
    - $ref: '../../components/parameters/IfMatch.yaml'
  requestBody:
    required: true
    content:
      application/merge-patch+json:
        schema:
          $ref: '../../components/schemas/BrandColorsPatch.yaml'
  responses:
    '200':
      $ref: '../../components/responses/BrandColorsResponse.yaml'
    '400':
      $ref: '../../components/responses/BadRequest.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/BrandingForbidden.yaml'
    '412':
      $ref: '../../components/responses/PreconditionFailed.yaml'
    '422':
      $ref: '../../components/responses/ValidationFailed.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
    '503':
      $ref: '../../components/responses/SettingsTemporaryFailure.yaml'
