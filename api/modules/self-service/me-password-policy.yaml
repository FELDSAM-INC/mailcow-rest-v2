get:
  operationId: getOwnPasswordPolicy
  tags: [Own account]
  summary: Read the rules for my new password
  description: |
    Returns the password policy that a new password of the signed-in account must meet, with the
    same values and version tag as `getPasswordPolicy`. Available to every role, also in a session
    restricted by a forced password change. Not available to API keys. Changes nothing.
  security:
    - sessionCookie: []
  responses:
    '200':
      $ref: '../../components/responses/PasswordPolicyResponse.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/SelfServiceForbidden.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
    '503':
      $ref: '../../components/responses/SelfServiceTemporaryFailure.yaml'
