type: object
description: |
  One action applied to up to 100 relayhosts, as the legacy mass actions do. Each target is
  processed, checked and audited on its own. `delete` clears the assignments of each deleted
  relayhost, as the single deletion does.
required: [action, targets]
properties:
  action:
    type: string
    enum: [activate, deactivate, delete]
  targets:
    type: array
    minItems: 1
    maxItems: 100
    items:
      $ref: './BulkTarget.yaml'
