description: The app password was created. `generatedPassword` is set only when the system generated the password, and is never shown again.
headers:
  Location:
    description: Absolute path of the created resource.
    required: true
    schema:
      type: string
      format: uri-reference
  ETag:
    description: Version tag (strong ETag) of the resource's stored settings, equal to `data.etag`. Send it in `If-Match` when changing the resource.
    required: true
    schema:
      type: string
content:
  application/json:
    schema:
      type: object
      required: [data]
      properties:
        data:
          $ref: '../schemas/AppPasswordResult.yaml'
