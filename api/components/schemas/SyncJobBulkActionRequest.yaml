type: object
description: |
  One action applied to several sync jobs. The number of items must not exceed the bulk limit
  (default 100, see `GET /sync-jobs/capabilities`); a larger request is refused with `tooMany`
  (param `max`) on `items`. A malformed item refuses the whole request, with every bad item named.
  A job named twice is processed and reported once.
required: [action, items]
properties:
  action:
    $ref: './SyncJobBulkAction.yaml'
  items:
    type: array
    minItems: 1
    items:
      $ref: './SyncJobBulkTarget.yaml'
