parameters:
  - $ref: '../../components/parameters/MailboxAddress.yaml'
get:
  operationId: listAppPasswords
  tags: [Mailbox self-service]
  summary: List the app passwords of a mailbox
  description: |
    Lists the mailbox's app passwords, never with their password or hash. `q` searches the name.
    Administrators (any mailbox), domain administrators (mailboxes of their domains) and mailbox
    users (their own mailbox), from a session or a key; reading needs no permission flag.
  security:
    - sessionCookie: []
    - apiKeyAuth: []
  parameters:
    - $ref: '../../components/parameters/Limit.yaml'
    - $ref: '../../components/parameters/Offset.yaml'
    - $ref: '../../components/parameters/AppPasswordSort.yaml'
    - $ref: '../../components/parameters/Order.yaml'
    - $ref: '../../components/parameters/Search.yaml'
    - name: active
      in: query
      required: false
      description: Only active (`true`) or inactive (`false`) app passwords.
      schema:
        type: boolean
  responses:
    '200':
      $ref: '../../components/responses/AppPasswordListResponse.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/SelfServiceForbidden.yaml'
    '404':
      $ref: '../../components/responses/NotFound.yaml'
    '422':
      $ref: '../../components/responses/ValidationFailed.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
post:
  operationId: createAppPassword
  tags: [Mailbox self-service]
  summary: Create an app password
  description: |
    Creates an app password for the mailbox, for the chosen protocols (all six by default), active
    by default. Without `password`, the system generates 32 random characters that meet the
    password policy and returns them once as `generatedPassword`. An app password authenticates
    only to its own protocols, independently of the mailbox's own protocol access, never signs in
    to the web UI or webmail, and takes effect at the mail server's next authentication.

    Needs the `appPasswds` permission: the mailbox user's own flag, or the domain administrator's
    own `appPasswds` flag (`permission-flag-required`). Session or read-write key. Audited, without
    the password.
  security:
    - sessionCookie: []
      csrfToken: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/AppPasswordCreateRequest.yaml'
  responses:
    '201':
      $ref: '../../components/responses/AppPasswordCreated.yaml'
    '400':
      $ref: '../../components/responses/BadRequest.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/SelfServiceForbidden.yaml'
    '404':
      $ref: '../../components/responses/NotFound.yaml'
    '415':
      $ref: '../../components/responses/UnsupportedMediaType.yaml'
    '422':
      $ref: '../../components/responses/ValidationFailed.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
