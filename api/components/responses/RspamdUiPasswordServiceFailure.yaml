description: |
  mailcow's container service reported that it could not set the password or restart Rspamd (type
  `/api/v2/problems/container-action-failed`, `container: rspamd-mailcow`). The password may have
  been stored for Rspamd and would then apply at Rspamd's next start; `detail` says so. The
  service's own message is not relayed for this operation, so the password can never appear in the
  problem.
content:
  application/problem+json:
    schema:
      $ref: '../schemas/ContainerProblem.yaml'
