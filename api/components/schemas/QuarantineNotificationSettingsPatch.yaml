type: object
description: |
  JSON Merge Patch of `QuarantineNotificationSettings`. A member that is not sent keeps its value.
  A mailbox user needs `quarantine_notification` to change `frequency` and `quarantine_category` to
  change `category`.
minProperties: 1
properties:
  frequency:
    $ref: './QuarantineNotificationFrequency.yaml'
  category:
    $ref: './QuarantineNotificationCategory.yaml'
additionalProperties: false
