type: object
description: "JSON Merge Patch of a sync job. Omitted members keep their values; a body without any of\
  \ the\nmembers below is refused (`required` on `body`). `null` is refused for every member\n(`invalidType`).\
  \ A member whose value differs from the stored one is validated with the rules of\n`SyncJobCreateRequest`;\
  \ a member sent with its stored value, and every member not sent, is\naccepted as stored, even if it\
  \ predates the current rules. Unknown and read-only members (`id`,\n`runStatus`, `etag`, \u2026) are\
  \ ignored, so a client may send back what it read.\n\n- `active` activates or deactivates the job; the\
  \ change takes effect from the runner's next\n  cycle and never interrupts a run in progress.\n- `remotePassword`:\
  \ a non-empty value replaces the stored password; an empty string keeps it\n  only while the remote\
  \ host, port, encryption and username are unchanged. Changing any of\n  those fields while a password\
  \ is stored requires password re-entry (`secretRequired`).\n- `mailbox` cannot change: the current address\
  \ is accepted, any other is refused with the rule\n  code `immutable`. To sync into another mailbox,\
  \ create a new job.\n- `customParameters`: when the server restricts custom parameters to administrators,\
  \ a value\n  from another role that differs from the stored one is refused with `customParamsNotPermitted`;\n\
  \  the stored value sent unchanged is accepted.\n"
minProperties: 1
properties:
  mailbox:
    type: string
    format: email
    maxLength: 255
  remoteHost:
    type: string
    minLength: 1
    maxLength: 255
  remotePort:
    type: integer
    minimum: 1
    maximum: 65535
  encryption:
    $ref: ./SyncJobEncryption.yaml
  remoteUser:
    type: string
    minLength: 1
    maxLength: 255
  remotePassword:
    type: string
    maxLength: 255
    writeOnly: true
  exclude:
    type: string
    maxLength: 500
  destinationSubfolder:
    type: string
    maxLength: 255
  intervalMinutes:
    type: integer
    minimum: 1
    maximum: 43800
  maxAgeDays:
    type: integer
    minimum: 0
    maximum: 32000
  maxBytesPerSecond:
    type: integer
    minimum: 0
    maximum: 125000000
  remoteTimeoutSeconds:
    type: integer
    minimum: 1
    maximum: 32000
  localTimeoutSeconds:
    type: integer
    minimum: 1
    maximum: 32000
  deleteFromSource:
    type: boolean
  deleteFromDestination:
    type: boolean
  deleteDuplicatesOnDestination:
    type: boolean
  automap:
    type: boolean
  skipCrossDuplicates:
    type: boolean
  subscribeAll:
    type: boolean
  dryRun:
    type: boolean
  customParameters:
    type: string
    maxLength: 512
  active:
    type: boolean
  sourceId:
    type: integer
    minimum: 1
    description: Use an existing visible active source (mailcow 2026-11). Connection fields come from
      that source; password sources require a password. Authorization-code sources require a connected
      account for the target mailbox.
  priority:
    type: integer
    minimum: -2147483648
    maximum: 2147483647
    description: Global queue priority; administrator only. Larger values run first. Requires mailcow
      2026-11.
