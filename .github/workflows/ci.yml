# Quality gates of mailcow REST API v2 (constitution "Development Workflow & Quality Gates",
# research R25): contract lint and breaking-change check, Pint and Larastan, the contract-validated
# test suite on every supported schema, and the production image.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PUBLISH_IMAGES: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
  REDOCLY_CLI: '@redocly/cli@2.64.1'
  OASDIFF_IMAGE: tufin/oasdiff:v1.32.1
  IMAGE_NAME: ghcr.io/feldsam-inc/mailcow-rest-v2
  DEV_IMAGE: restv2-dev:ci

jobs:
  security:
    uses: ./.github/workflows/security.yml

  contract:
    name: Contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test subscription scan runner (no model calls)
        run: node --test scripts/security/scan-local.test.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Lint
        run: npx --yes "$REDOCLY_CLI" lint api/openapi.yaml
      - name: Bundle
        run: |
          npx --yes "$REDOCLY_CLI" bundle api/openapi.yaml --output build/contract/openapi.yaml
          npx --yes "$REDOCLY_CLI" bundle api/openapi.yaml --dereferenced --ext json --output build/contract/openapi.json
      - name: Breaking changes against the latest release
        run: |
          base_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -z "$base_tag" ]; then
            echo "::notice title=Breaking-change check skipped::No v* tag exists yet."
            exit 0
          fi
          git worktree add --detach "$RUNNER_TEMP/base" "$base_tag"
          npx --yes "$REDOCLY_CLI" bundle "$RUNNER_TEMP/base/api/openapi.yaml" --output build/contract/base.yaml
          docker run --rm -v "$PWD/build/contract:/specs:ro" "$OASDIFF_IMAGE" \
            breaking /specs/base.yaml /specs/openapi.yaml --fail-on ERR
      - name: Webmail hand-off assumptions of every supported release (feature 005, R3)
        run: |
          git clone --quiet --bare --filter=blob:none https://github.com/mailcow/mailcow-dockerized.git "$RUNNER_TEMP/mailcow"
          for fixture in tests/fixtures/schema/*.sql; do
            MAILCOW_REPO="$RUNNER_TEMP/mailcow" scripts/legacy/check-handoff-assumptions.sh "$(basename "$fixture" .sql)"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract
          path: |
            build/contract/openapi.yaml
            build/contract/openapi.json

  dev-image:
    name: Shared development image (AMD64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build the dev image once for quality and schema tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: docker/php/Dockerfile
          target: dev
          platforms: linux/amd64
          load: true
          tags: ${{ env.DEV_IMAGE }}
          cache-from: |
            type=gha,scope=api-dev-linux-amd64
            type=gha,scope=api-production-linux-amd64
          cache-to: type=gha,scope=api-dev-linux-amd64,mode=max
      - name: Export the dev image
        run: |
          mkdir -p "$RUNNER_TEMP/dev-image"
          docker save --output "$RUNNER_TEMP/dev-image/image.tar" "$DEV_IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dev-image-linux-amd64
          path: ${{ runner.temp }}/dev-image/image.tar
          compression-level: 1
          retention-days: 1

  quality:
    needs: dev-image
    name: Pint and Larastan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dev-image-linux-amd64
          path: ${{ runner.temp }}/dev-image
      - name: Load the shared dev image
        run: docker load --input "$RUNNER_TEMP/dev-image/image.tar"
      - name: Composer install
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/app" -w /app "$DEV_IMAGE" composer install --no-interaction --no-progress
      - name: Pint
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/app" -w /app "$DEV_IMAGE" vendor/bin/pint --test
      - name: Larastan
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/app" -w /app "$DEV_IMAGE" vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  schemas:
    name: Supported schemas
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: |
          matrix="$(find tests/fixtures/schema -maxdepth 1 -name '*.sql' -printf '%f\n' | sed 's/\.sql$//' | sort | jq -R . | jq -cs .)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  tests:
    name: Tests (schema ${{ matrix.schema }})
    needs: [schemas, dev-image]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        schema: ${{ fromJSON(needs.schemas.outputs.matrix) }}
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mailcow
          MYSQL_USER: mailcow
          MYSQL_PASSWORD: mailcow
          MYSQL_INITDB_SKIP_TZINFO: '1'
          TZ: Europe/Prague
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4.11-alpine
        env:
          TZ: Europe/Prague
      # Feature 012: the real LDAP adapter (group idp). The tests add the people of
      # tests/fixtures/ldap/bootstrap.ldif themselves, because services start before checkout.
      openldap:
        image: osixia/openldap:1.5.0
        env:
          LDAP_ORGANISATION: Example
          LDAP_DOMAIN: example.org
          LDAP_ADMIN_PASSWORD: ldap-secret
          LDAP_TLS: 'true'
          LDAP_TLS_VERIFY_CLIENT: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply mailcow's server settings
        # Services start before checkout, so mailcow's my.cnf (docker/mariadb/mailcow.cnf) and the
        # Redis password (mailcow's redis-conf.sh) are applied at runtime.
        run: |
          docker exec "${{ job.services.mariadb.id }}" mariadb -uroot -proot -e \
            "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_general_ci'; SET GLOBAL innodb_strict_mode = 0;"
          docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET requirepass devredispass
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dev-image-linux-amd64
          path: ${{ runner.temp }}/dev-image
      - name: Load the shared dev image
        run: docker load --input "$RUNNER_TEMP/dev-image/image.tar"
      - name: Composer install
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/app" -w /app "$DEV_IMAGE" composer install --no-interaction --no-progress
      - name: composer test
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/app" -w /app \
            --network "${{ job.services.mariadb.network }}" \
            -e DBHOST=mariadb -e DBUSER=mailcow -e DBPASS=mailcow -e DBROOT=root \
            -e REDISHOST=redis -e REDISPASS=devredispass \
            -e MAILCOW_SCHEMA="${{ matrix.schema }}" \
            "$DEV_IMAGE" composer test
      - name: composer test:performance
        if: vars.PERFORMANCE_CHECKS_ENABLED == 'true'
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/app" -w /app \
            --network "${{ job.services.mariadb.network }}" \
            -e DBHOST=mariadb -e DBUSER=mailcow -e DBPASS=mailcow -e DBROOT=root \
            -e REDISHOST=redis -e REDISPASS=devredispass \
            -e MAILCOW_SCHEMA="${{ matrix.schema }}" \
            "$DEV_IMAGE" composer test:performance
      - name: LDAP integration (group idp)
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/app" -w /app \
            --network "${{ job.services.mariadb.network }}" \
            -e DBHOST=mariadb -e DBUSER=mailcow -e DBPASS=mailcow -e DBROOT=root \
            -e REDISHOST=redis -e REDISPASS=devredispass \
            "$DEV_IMAGE" vendor/bin/phpunit --group idp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: contract-coverage-${{ matrix.schema }}
          path: build/contract/coverage.json
          if-no-files-found: ignore

  image:
    name: Production image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Image tags and source labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/feldsam-inc/mailcow-rest-v2
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=match,pattern=v(.*),group=1
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-only
      - name: Log in to GHCR
        if: env.PUBLISH_IMAGES == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the native platform image once
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: docker/php/Dockerfile
          target: production
          platforms: linux/${{ matrix.arch }}
          push: ${{ env.PUBLISH_IMAGES == 'true' }}
          load: ${{ env.PUBLISH_IMAGES != 'true' }}
          tags: ${{ env.IMAGE_NAME }}:scan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          sbom: ${{ env.PUBLISH_IMAGES == 'true' }}
          provenance: ${{ env.PUBLISH_IMAGES == 'true' && 'mode=max' || 'false' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=api-production-linux-${{ matrix.arch }}
            type=gha,scope=api-dev-linux-${{ matrix.arch }}
          cache-to: type=gha,scope=api-production-linux-${{ matrix.arch }},mode=max
      - name: Select the exact image to test
        id: reference
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          if [ "$PUBLISH_IMAGES" = 'true' ]; then
            [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            reference="$IMAGE_NAME@$IMAGE_DIGEST"
          else
            reference="$IMAGE_NAME:scan-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$IMAGE_ARCH"
          fi
          echo "image=$reference" >> "$GITHUB_OUTPUT"
      - name: Scan the platform image
        env:
          IMAGE_REFERENCE: ${{ steps.reference.outputs.image }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: python3 scripts/security/check.py image --image "$IMAGE_REFERENCE" --platform "linux/$IMAGE_ARCH"
      - name: Retain image scan and SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: production-image-security-linux-${{ matrix.arch }}
          path: security-reports/
          retention-days: 7
      - name: Liveness inside the container
        env:
          IMAGE_REFERENCE: ${{ steps.reference.outputs.image }}
        run: docker run --rm "$IMAGE_REFERENCE" php /app/artisan restv2:health --live
      - name: nginx snippet
        run: |
          docker run --rm \
            -v "$PWD/docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/nginx/site.restv2.custom:/etc/nginx/conf.d/site.restv2.custom:ro" \
            nginx:1.28-alpine nginx -t
      - name: Record the verified platform digest
        if: env.PUBLISH_IMAGES == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/digests/linux-$IMAGE_ARCH.txt"
      - if: env.PUBLISH_IMAGES == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-digest-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/linux-${{ matrix.arch }}.txt
          overwrite: true
          retention-days: 1

  publish:
    name: Publish public image
    needs: [contract, quality, tests, image, security]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image tags and source labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/feldsam-inc/mailcow-rest-v2
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=match,pattern=v(.*),group=1
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-only
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: image-digest-linux-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Assemble the already tested platform images
        id: publish
        run: |
          sources=()
          for architecture in amd64 arm64; do
            digest="$(cat "$RUNNER_TEMP/digests/linux-$architecture.txt")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            sources+=("$IMAGE_NAME@$digest")
          done
          candidate="$IMAGE_NAME:scan-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx imagetools create --tag "$candidate" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$candidate" --format '{{json .Manifest}}' | jq -r '.digest')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Scan both candidate architectures before promoting release tags
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          python3 scripts/security/check.py image --image "ghcr.io/feldsam-inc/mailcow-rest-v2@$IMAGE_DIGEST" --platform linux/amd64
          python3 scripts/security/check.py image --image "ghcr.io/feldsam-inc/mailcow-rest-v2@$IMAGE_DIGEST" --platform linux/arm64
      - name: Promote verified image to public release tags
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] || args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create "${args[@]}" "ghcr.io/feldsam-inc/mailcow-rest-v2@$IMAGE_DIGEST"
      - name: Retain release scans and SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-image-security
          path: security-reports/
          retention-days: 14
      - name: Record published image
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### Container image'
            printf '\n%s\n' "$IMAGE_TAGS"
            printf '\nDigest: `%s`\n' "$IMAGE_DIGEST"
            echo 'First publication requires Package settings → Change visibility → Public.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify anonymous registry access
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_config"' EXIT
          if ! docker --config "$anonymous_config" manifest inspect "ghcr.io/feldsam-inc/mailcow-rest-v2@$IMAGE_DIGEST" > /dev/null; then
            echo '::error::Image was pushed but is not publicly pullable. Set this GHCR package visibility to Public, then rerun the publishing job.'
            exit 1
          fi
