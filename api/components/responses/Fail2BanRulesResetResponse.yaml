description: The rules were reset and the ban service restored mailcow's default rules.
headers:
  ETag:
    description: Version tag of the rules, equal to `data.etag`.
    required: true
    schema:
      type: string
  Audit-Recorded:
    description: |
      Sent with the value `false` only when the operation was carried out but its audit record
      could not be written within the container-service timeout (for example because the operation
      restarted the database). The failure is in the service log. Absent otherwise.
    required: false
    schema:
      type: string
      enum: ["false"]
content:
  application/json:
    schema:
      type: object
      required: [data]
      properties:
        data:
          $ref: '../schemas/Fail2BanRules.yaml'
