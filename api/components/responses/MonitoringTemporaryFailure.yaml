description: |
  A mailcow service this operation needs is unavailable (type `/api/v2/problems/temporary-failure`):
  the container service, the key-value store (Redis), the database or the Rspamd controller, or the
  audit log before an irreversible operation. Nothing was changed. Retry after `Retry-After`.
headers:
  Retry-After:
    description: Seconds after which the request may be retried.
    required: true
    schema:
      type: integer
      minimum: 1
content:
  application/problem+json:
    schema:
      $ref: '../schemas/Problem.yaml'
