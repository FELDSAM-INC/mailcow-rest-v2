description: |
  The account has active second factors. Possible types:
  - `/api/v2/problems/second-factor-required`: the completion carried no second factor. Extension
    `methods` lists the usable ones; resend the new password with one of them. The token stays valid.
  - `/api/v2/problems/second-factor-failed`: the second factor was wrong, a TOTP code was already
    used, or the WebAuthn challenge was missing or expired. The token stays valid; the failure counts
    towards the sign-in throttling of the account and client address.
  - The API key types of `Unauthorized` when the request carries an invalid `X-API-Key`.
content:
  application/problem+json:
    schema:
      anyOf:
        - $ref: '../schemas/PasswordResetSecondFactorRequiredProblem.yaml'
        - $ref: '../schemas/Problem.yaml'
