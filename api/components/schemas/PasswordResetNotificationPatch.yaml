type: object
description: |
  JSON Merge Patch of the password reset notification. An empty `sender` or `subject` switches
  password reset off. Sending both templates empty, or one empty while the other is stored empty,
  restores mailcow's default templates. Templates are at most 1 MiB (1,048,576 bytes) each.
minProperties: 1
additionalProperties: false
properties:
  sender:
    type: string
    maxLength: 255
    description: Empty, or a valid e-mail address without control characters.
  subject:
    type: string
    maxLength: 255
    description: At most 255 characters, without line breaks.
  textTemplate:
    type: string
  htmlTemplate:
    type: string
