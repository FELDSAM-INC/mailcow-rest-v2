post:
  operationId: holdMailQueueMessages
  tags: [Mail queue]
  summary: Hold selected messages
  description: |
    Moves the selected messages to the hold queue (`postsuper -h`, legacy "Hold"). Completes before
    the response. Holding a message that is already held is `done` without change.

    Applies to 1 to 1,000 queue IDs in one request (`MailQueueBulkRequest`). Each distinct ID gets
    one result, in request order: `done`, or `notFound` when the message is not in the queue when
    the request is processed. A missing ID never stops the others. Queued messages have no version
    tag, so items carry none. More than 1,000 IDs or a non-hexadecimal ID refuses the whole request
    (`422`) and nothing changes. A stopped Postfix container answers `mail-service-not-running`;
    a Postfix failure answers `queue-action-failed`; a container-service timeout answers
    `outcome-unknown`. Needs an administrator session or a read-write key owned by an
    administrator.

    The request writes **one** audit record that lists every ID with its result (queued messages are
    transient system objects; this is the documented exception to one record per object). When the
    audit log cannot be written before the action, the request is refused with `temporary-failure`
    and nothing is done. When the record cannot be written after the action, the response carries the
    header `Audit-Recorded: false`.
  security:
    - sessionCookie: []
      csrfToken: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/MailQueueBulkRequest.yaml'
  responses:
    '200':
      $ref: '../../components/responses/BulkResultResponse.yaml'
    '400':
      $ref: '../../components/responses/BadRequest.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/Forbidden.yaml'
    '409':
      $ref: '../../components/responses/MailQueueConflict.yaml'
    '422':
      $ref: '../../components/responses/ValidationFailed.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
    '502':
      $ref: '../../components/responses/MailQueueActionFailed.yaml'
    '503':
      $ref: '../../components/responses/MonitoringTemporaryFailure.yaml'
    '504':
      $ref: '../../components/responses/MonitoringOutcomeUnknown.yaml'
