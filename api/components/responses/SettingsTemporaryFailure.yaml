description: |
  A mailcow service the operation needs is unavailable (type `/api/v2/problems/temporary-failure`):
  mailcow's shared store (Redis), or for the effective settings map mailcow's settings map endpoint.
  Nothing was changed. Retry later.
headers:
  Retry-After:
    description: Seconds after which the request may be retried.
    required: true
    schema:
      type: integer
      minimum: 1
content:
  application/problem+json:
    schema:
      $ref: '../schemas/Problem.yaml'
