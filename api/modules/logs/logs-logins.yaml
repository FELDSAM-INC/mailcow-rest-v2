get:
  operationId: listLoginLog
  tags: [Logs]
  summary: List the login log
  description: |
    Recent mailbox logins per service and client address (table `sasl_log`, cleaned daily by
    mailcow): username, service, client address and whether an app password was used. Times are
    converted from the server's time zone to UTC. Legacy web UI logins are reported with the service
    label configured in feature 001, and filters match the reported label. `q` searches the username,
    service and client address.

    Administrators only, read-only keys included. Reads are not audited. Entries are returned as
    mailcow retains them (see `MonitoringCapabilities.logRetention`); entries that cannot be parsed
    are left out of the list and the total. Sorted by time, newest first by default; entries with
    the same time keep the order in which mailcow stored them. `from` and `to` are inclusive. Text
    filters match case-insensitively as substrings, and several values of one filter match entries
    with any of them. To load older entries while new ones arrive, pass the `id` of the oldest entry
    held as `before`.
  security:
    - sessionCookie: []
    - apiKeyAuth: []
  parameters:
    - $ref: '../../components/parameters/Limit.yaml'
    - $ref: '../../components/parameters/Offset.yaml'
    - $ref: '../../components/parameters/LogSort.yaml'
    - $ref: '../../components/parameters/Order.yaml'
    - $ref: '../../components/parameters/Search.yaml'
    - $ref: '../../components/parameters/LogFrom.yaml'
    - $ref: '../../components/parameters/LogTo.yaml'
    - $ref: '../../components/parameters/LogBefore.yaml'
    - name: username
      in: query
      required: false
      description: Only entries whose username contains one of these values.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 255
    - name: service
      in: query
      required: false
      description: Only entries whose reported service contains one of these values.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 255
    - name: clientAddress
      in: query
      required: false
      description: Only entries whose client address contains one of these values.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 255
  responses:
    '200':
      $ref: '../../components/responses/LoginLogEntryListResponse.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/Forbidden.yaml'
    '422':
      $ref: '../../components/responses/ValidationFailed.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
    '503':
      $ref: '../../components/responses/MonitoringTemporaryFailure.yaml'
