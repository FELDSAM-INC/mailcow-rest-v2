type: object
description: |
  JSON Merge Patch of the password policy (feature 013). Members that are not sent keep their
  values. `minLength` is a whole number from 3 to 64 (`outOfRange`, params `min`, `max`); legacy
  silently keeps the old value instead.
minProperties: 1
additionalProperties: false
properties:
  minLength:
    type: integer
    minimum: 3
    maximum: 64
  requireLetters:
    type: boolean
  requireDigits:
    type: boolean
  requireSpecialCharacters:
    type: boolean
  requireMixedCase:
    type: boolean
