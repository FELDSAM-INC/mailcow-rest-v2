description: The mailbox was created. The response reports each follow-up step.
headers:
  Location:
    description: Absolute path of the created mailbox (`/api/v2/mailboxes/{address}`).
    required: true
    schema:
      type: string
      format: uri-reference
  ETag:
    description: Version tag (strong ETag) of the mailbox's stored settings, equal to `data.etag`.
    required: true
    schema:
      type: string
content:
  application/json:
    schema:
      type: object
      required: [data]
      properties:
        data:
          $ref: '../schemas/MailboxCreated.yaml'
