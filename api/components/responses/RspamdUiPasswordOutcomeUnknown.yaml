description: |
  mailcow's container service did not answer within its timeout (`DOCKER_TIMEOUT`, 60 seconds), so
  whether the password was set is unknown (type `/api/v2/problems/outcome-unknown`, `step:
  rspamdUiPassword`). Setting it again is safe.
content:
  application/problem+json:
    schema:
      allOf:
        - $ref: '../schemas/Problem.yaml'
        - type: object
          required: [step]
          properties:
            step:
              type: string
              const: rspamdUiPassword
