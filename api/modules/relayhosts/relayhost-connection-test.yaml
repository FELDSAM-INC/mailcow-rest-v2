parameters:
  - $ref: '../../components/parameters/RelayhostId.yaml'
post:
  operationId: testRelayhostConnection
  tags: [Relayhosts]
  summary: Test a relayhost
  description: |
    Connects to the relayhost's host with its stored credentials and sends a short test message, as
    the legacy "Test" dialog does (see `RoutingConnectionTestResult`). Inactive relayhosts can be
    tested. The test sends a real message to the recipient, so it is a state-changing request: it
    needs a session with the anti-forgery token or a read-write key, and it is audited (sender,
    recipient, outcome and step, never the transcript). It answers within about 60 seconds.
    Administrators only.
  security:
    - sessionCookie: []
      csrfToken: []
    - apiKeyAuth: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/RoutingConnectionTestRequest.yaml'
  responses:
    '200':
      $ref: '../../components/responses/RoutingConnectionTestResponse.yaml'
    '400':
      $ref: '../../components/responses/BadRequest.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/Forbidden.yaml'
    '404':
      $ref: '../../components/responses/NotFound.yaml'
    '415':
      $ref: '../../components/responses/UnsupportedMediaType.yaml'
    '422':
      $ref: '../../components/responses/ValidationFailed.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
