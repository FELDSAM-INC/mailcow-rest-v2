parameters:
- in: path
  name: sourceId
  required: true
  schema:
    type: integer
    minimum: 1
post:
  operationId: startSyncSourceOAuth
  tags:
  - Sync sources
  summary: Connect a remote OAuth account
  description: Requires mailcow 2026-11 and the syncjobs permission. Sources are scoped by creator and
    explicit domain/mailbox targets. OAuth credentials and tokens are write-only. Endpoint changes require
    access to every attached job. Configuration writes support If-Match.
  security:
  - sessionCookie: []
    csrfToken: []
  responses:
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '412':
      $ref: ../../components/responses/PreconditionFailed.yaml
    '415':
      $ref: ../../components/responses/UnsupportedMediaType.yaml
    '422':
      $ref: ../../components/responses/ValidationFailed.yaml
    '500':
      $ref: ../../components/responses/InternalError.yaml
    '409':
      description: Unsupported schema, conflicting source state or unavailable provider.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/Problem.yaml
    '503':
      description: Unsupported schema, conflicting source state or unavailable provider.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/Problem.yaml
    '200':
      description: The requested data.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - data
            properties:
              data:
                type: object
                additionalProperties: false
                required:
                - authorizationUrl
                - expiresAt
                properties:
                  authorizationUrl:
                    type: string
                    format: uri
                  expiresAt:
                    type: string
                    format: date-time
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
          - mailbox
          properties:
            mailbox:
              type: string
              format: email
