# HTTPS listener of the dev stack (quickstart Part B). The session cookie is always `Secure`, so
# clients such as curl keep it only over HTTPS. The self-signed certificate is generated at stack
# start by the one-shot service `certs` into the volume `dev-certs`; it is never committed. Use
# `curl -k` (or accept the certificate once in a browser). The plain HTTP listener (dev.conf) stays
# for health checks.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;

    include /etc/nginx/conf.d/site.restv2.custom;
}
