<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300px" height="80px">
  <defs>
    <clipPath id="clip"><rect width="300" height="80" rx="8"/></clipPath>
    <image id="bitmap" width="300" height="80" xlink:href="data:image/png;base64,"/>
  </defs>
  <style>.mark { fill: url(#fade); }</style>
  <linearGradient id="fade"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <use href="#bitmap" clip-path="url(#clip)"/>
  <rect class="mark" x="0" y="70" width="300" height="10" filter="url(#none)"/>
</svg>
