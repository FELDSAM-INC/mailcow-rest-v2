get:
  operationId: getPasswordResetNotification
  tags: [Password settings]
  summary: Get the password reset notification
  description: |
    Returns the sender, subject and templates of the password reset e-mail, whether self-service
    password reset is available (only while both a sender and a subject are set), and mailcow's
    default templates, marked as defaults, while both stored templates are empty. Administrators
    only, by session or by an administrator's key, read-only keys included.
  security:
    - sessionCookie: []
    - apiKeyAuth: []
  responses:
    '200':
      $ref: '../../components/responses/PasswordResetNotificationResponse.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/Forbidden.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
    '503':
      $ref: '../../components/responses/SettingsTemporaryFailure.yaml'
patch:
  operationId: updatePasswordResetNotification
  tags: [Password settings]
  summary: Change the password reset notification
  description: |
    Changes the sent values. The sender is empty or a valid e-mail address without control
    characters (an invalid sender is refused; legacy stores it empty). The subject has at most 255
    characters without line breaks; each template at most 1 MiB. Clearing the sender or the subject
    switches self-service password reset off (feature 005). Leaving both templates empty restores
    mailcow's defaults. A template without `{{link}}` is accepted, as in legacy, but the e-mail is
    then useless. Audited; templates only as changed, with their old and new sizes.
  security:
    - sessionCookie: []
      csrfToken: []
    - apiKeyAuth: []
  parameters:
    - $ref: '../../components/parameters/IfMatch.yaml'
  requestBody:
    required: true
    content:
      application/merge-patch+json:
        schema:
          $ref: '../../components/schemas/PasswordResetNotificationPatch.yaml'
  responses:
    '200':
      $ref: '../../components/responses/PasswordResetNotificationResponse.yaml'
    '400':
      $ref: '../../components/responses/BadRequest.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/Forbidden.yaml'
    '412':
      $ref: '../../components/responses/PreconditionFailed.yaml'
    '415':
      $ref: '../../components/responses/UnsupportedMediaType.yaml'
    '422':
      $ref: '../../components/responses/ValidationFailed.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
    '503':
      $ref: '../../components/responses/SettingsTemporaryFailure.yaml'
