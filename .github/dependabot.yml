version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      ci-actions:
        patterns: ['*']
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      compatible-packages:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # This test fixture must match legacy mailcow's OAuth library and database schema.
      # Newer releases require PKCE columns absent from the supported upstream fixtures.
      - dependency-name: bshaffer/oauth2-server-php
      # Review major test-toolchain migrations separately from compatible updates.
      - dependency-name: phpunit/phpunit
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directory: /docker/php
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Keep asset builds on the Node 22 line used by CI. Review runtime migrations separately.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
