type: object
description: |
  An alternative password of a mailbox for selected protocols (mailcow `app_passwd`). It
  authenticates only to its own protocols, independently of the mailbox's own protocol access, and
  never signs in to the web UI or webmail. Changes apply at the mail server's next authentication.
  The password and its hash are never returned.
required: [id, mailbox, name, protocols, active, createdAt, modifiedAt, etag]
properties:
  id:
    type: integer
    minimum: 1
  mailbox:
    type: string
    examples: [anna@example.org]
  name:
    type: string
    description: Plain text. Legacy stores it HTML-encoded; this API encodes and decodes it.
    examples: [Phone]
  protocols:
    type: array
    uniqueItems: true
    items:
      $ref: './AppPasswordProtocol.yaml'
  active:
    type: boolean
  createdAt:
    type: string
    format: date-time
  modifiedAt:
    oneOf:
      - type: string
        format: date-time
      - type: 'null'
  etag:
    type: string
    description: Version tag of the stored values, equal to the `ETag` header of a single read.
