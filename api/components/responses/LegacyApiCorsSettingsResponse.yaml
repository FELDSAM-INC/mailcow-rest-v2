description: The legacy API's CORS settings.
headers:
  ETag:
    description: Version tag (strong ETag) of the resource's stored settings, equal to `data.etag`. Send it in `If-Match` when changing the resource.
    required: true
    schema:
      type: string
content:
  application/json:
    schema:
      type: object
      required: [data]
      properties:
        data:
          $ref: '../schemas/LegacyApiCorsSettings.yaml'
