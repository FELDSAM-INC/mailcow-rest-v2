name: Security checks

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  scan:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        check: [secrets, source, config]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test scanner failure and reporting behavior
        run: python3 -m unittest discover -s scripts/security -p "*_test.py"
      - name: Run pinned local scanners
        run: python3 scripts/security/check.py "${{ matrix.check }}"
      - name: Retain reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: security-${{ matrix.check }}
          path: security-reports/
          retention-days: 7
          if-no-files-found: ignore

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit all locked Composer dependencies
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/app:ro" -w /app composer:2@sha256:b6dcd72ca98fa19d0e5b8476de179859704891fad06dd9e0b96833d4c430a5fc audit --locked --no-plugins --no-scripts --no-interaction

  published-images:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recheck published image against current vulnerability data
        run: python3 scripts/security/check.py image --image ghcr.io/feldsam-inc/mailcow-rest-v2:latest --platform "${{ matrix.platform }}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: published-image-${{ strategy.job-index }}
          path: security-reports/
          retention-days: 7
