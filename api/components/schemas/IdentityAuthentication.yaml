type: object
description: How the caller authenticated. `apiKey` is present only when `method` is `apiKey`.
required: [method]
properties:
  method:
    $ref: './AuthMethod.yaml'
  apiKey:
    type: object
    required: [id, name, prefix, accessLevel]
    properties:
      id:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      name:
        type: string
      prefix:
        type: string
        description: Non-secret leading characters of the key.
      accessLevel:
        $ref: './ApiKeyAccessLevel.yaml'
