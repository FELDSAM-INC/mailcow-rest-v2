description: |
  An OAuth2 client with its secret. Returned only by the creation and by a secret regeneration;
  the secret is never shown again.
allOf:
  - $ref: './Oauth2Client.yaml'
  - type: object
    required: [clientSecret]
    properties:
      clientSecret:
        type: string
        pattern: '^[0-9a-f]{24}$'
        description: 24 lowercase hexadecimal characters.
