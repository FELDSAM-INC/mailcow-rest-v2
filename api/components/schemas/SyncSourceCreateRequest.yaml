type: object
additionalProperties: false
required:
- name
- remoteHost
- remotePort
properties:
  name:
    type: string
    maxLength: 100
  description:
    type: string
    maxLength: 255
  scope:
    type: string
    enum:
    - all
    - domain
    - user
  domains:
    type: array
    items:
      type: string
  users:
    type: array
    items:
      type: string
  remoteHost:
    type: string
    maxLength: 253
  remotePort:
    type: integer
    minimum: 1
    maximum: 65535
  encryption:
    type: string
    enum:
    - ssl
    - starttls
    - plain
  verifyCertificate: &id001
    type: boolean
  authMechanism:
    type: string
    enum:
    - plain
    - login
    - cram-md5
    - xoauth2
  active: *id001
  oauth:
    type: object
    additionalProperties: false
    required: []
    properties:
      flow:
        type: string
        enum:
        - client_credentials
        - authorization_code
      tokenEndpoint:
        type: string
        maxLength: 500
      authorizationEndpoint:
        type: string
        maxLength: 500
      userInfoEndpoint:
        type: string
        maxLength: 500
      clientId:
        type: string
        maxLength: 500
      clientSecret:
        type: string
        maxLength: 500
      scope:
        type: string
        maxLength: 500
      extraParameters:
        type: object
        maxProperties: 50
        additionalProperties:
          type:
          - string
          - number
          - boolean
          - 'null'
