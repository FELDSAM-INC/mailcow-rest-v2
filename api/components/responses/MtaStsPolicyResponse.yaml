description: One MTA-STS policy.
headers:
  ETag:
    description: Version tag (strong ETag) of the stored policy, equal to `data.etag`. Send it in `If-Match` when changing the policy.
    required: true
    schema:
      type: string
content:
  application/json:
    schema:
      type: object
      required: [data]
      properties:
        data:
          $ref: '../schemas/MtaStsPolicy.yaml'
