get:
  operationId: listMailboxGroups
  tags:
  - Mailbox groups
  summary: List mailbox groups
  description: Requires mailcow 2026-11. Administrators and domain administrators
    with mailboxGroups permission can manage groups in scope. A foreign send-as or
    sharing grant makes a group read-only for domain administrators. Mailbox membership
    reads also allow the mailbox itself.
  security:
  - sessionCookie: []
  - apiKeyAuth: []
  responses:
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '422':
      $ref: ../../components/responses/ValidationFailed.yaml
    '500':
      $ref: ../../components/responses/InternalError.yaml
    '200':
      description: The requested data.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - data
            - meta
            properties:
              data:
                type: array
                items:
                  $ref: ../../components/schemas/MailboxGroupSummary.yaml
              meta:
                $ref: ../../components/schemas/ListMeta.yaml
    '409':
      description: Mailbox groups require mailcow 2026-11.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/Problem.yaml
  parameters:
  - $ref: ../../components/parameters/Limit.yaml
  - $ref: ../../components/parameters/Offset.yaml
  - $ref: ../../components/parameters/Order.yaml
  - $ref: ../../components/parameters/Search.yaml
  - in: query
    name: sort
    schema:
      type: string
      enum:
      - id
      - name
      - domain
      - address
      - active
      - priority
      default: name
post:
  operationId: createMailboxGroup
  tags:
  - Mailbox groups
  summary: Create a mailbox group
  description: Requires mailcow 2026-11. Administrators and domain administrators
    with mailboxGroups permission can manage groups in scope. A foreign send-as or
    sharing grant makes a group read-only for domain administrators. Mailbox membership
    reads also allow the mailbox itself.
  security:
  - sessionCookie: []
    csrfToken: []
  - apiKeyAuth: []
  responses:
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '422':
      $ref: ../../components/responses/ValidationFailed.yaml
    '500':
      $ref: ../../components/responses/InternalError.yaml
    '201':
      description: The requested data.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - data
            properties:
              data:
                $ref: ../../components/schemas/MailboxGroup.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '412':
      $ref: ../../components/responses/PreconditionFailed.yaml
    '415':
      $ref: ../../components/responses/UnsupportedMediaType.yaml
    '409':
      description: The schema is unsupported or a unique name or address is already
        in use.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/Problem.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/MailboxGroupCreateRequest.yaml
