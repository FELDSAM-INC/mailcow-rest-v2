description: |
  Problem of type `/api/v2/problems/attribute-not-permitted` (status `403`) for a mailbox user's
  change of their quarantine notification settings: a member that would change needs a flag the
  user lacks (`frequency`: `quarantineNotification`, `category`: `quarantineCategory`). A member
  sent with its current value is accepted. The whole request is refused and nothing changed.
allOf:
  - $ref: './Problem.yaml'
  - type: object
    required: [attributes, requiredFlags]
    properties:
      attributes:
        type: array
        minItems: 1
        description: The members that may not be changed, as in the request body.
        items:
          type: string
          enum: [frequency, category]
      requiredFlags:
        type: object
        description: The flag each member needs, named as in `PermissionFlags`.
        additionalProperties:
          type: string
          enum: [quarantineNotification, quarantineCategory]
        examples:
          - category: quarantineCategory
