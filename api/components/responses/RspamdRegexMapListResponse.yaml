description: |
  The editable global regex maps as summaries, without their content (gap G17). Each entry carries
  its version tag.
content:
  application/json:
    schema:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '../schemas/RspamdRegexMapSummary.yaml'
        meta:
          $ref: '../schemas/ListMeta.yaml'
