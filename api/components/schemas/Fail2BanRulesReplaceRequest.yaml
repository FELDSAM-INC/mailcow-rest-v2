type: object
description: |
  The complete new rule list, 1 to 100 rules in order; they are numbered from 1. Each rule must be
  1 to 1,000 characters long (`tooShort`, `tooLong`), compile in the regular-expression dialect of
  the ban service, Python `re` (`invalidRegex` with the compiler's message as param `error`),
  and contain at least one capture group (`missingCaptureGroup`). The first group must capture the
  client address: a rule whose first group captures something else, or may capture nothing, stops
  the ban service when it matches, so clients should test rules before saving. An empty list is
  refused (`required`), more than 100 rules too (`tooMany`). Errors use the key `rules.<n>`.
required: [rules]
properties:
  rules:
    type: array
    maxItems: 100
    items:
      type: string
      maxLength: 1000
additionalProperties: false
