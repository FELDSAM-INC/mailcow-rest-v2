get:
  operationId: listAuditEvents
  tags: [Audit]
  summary: List audit records
  description: |
    Lists audit records, newest first by default. Administrators only: a signed-in administrator
    or a key owned by an administrator. Records cannot be changed or deleted through the API and
    are removed after the configured retention period (365 days by default). `q` searches the
    actor username, the target name and the user agent.
  security:
    - sessionCookie: []
    - apiKeyAuth: []
  parameters:
    - $ref: '../../components/parameters/Limit.yaml'
    - $ref: '../../components/parameters/Offset.yaml'
    - $ref: '../../components/parameters/AuditEventSort.yaml'
    - $ref: '../../components/parameters/Order.yaml'
    - $ref: '../../components/parameters/Search.yaml'
    - name: from
      in: query
      required: false
      description: Only records at or after this time.
      schema:
        type: string
        format: date-time
    - name: to
      in: query
      required: false
      description: Only records before this time.
      schema:
        type: string
        format: date-time
    - name: eventType
      in: query
      required: false
      description: |
        Only these event types. Repeat the parameter for several. A type this server does not
        record (for example one of a feature it does not implement yet) matches no records.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items:
          $ref: '../../components/schemas/AuditEventType.yaml'
    - name: outcome
      in: query
      required: false
      schema:
        $ref: '../../components/schemas/AuditOutcome.yaml'
    - name: authMethod
      in: query
      required: false
      description: |
        Only records of these authentication methods. Repeat the parameter for several. Records
        without a method (`authMethod: null`) never match. A method this server does not record
        matches no records.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items:
          $ref: '../../components/schemas/AuthMethod.yaml'
    - name: requestId
      in: query
      required: false
      description: |
        Only records written while handling the request with this identifier (the `requestId` of
        its problem details and log lines, its W3C trace ID), so that the records of one request,
        for example one bulk action, can be linked.
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    - name: actor
      in: query
      required: false
      description: Only records whose actor username (including attempted usernames) or API key ID equals this value.
      schema:
        type: string
        maxLength: 255
    - name: clientAddress
      in: query
      required: false
      description: Only records from this IPv4 or IPv6 address, or from within this prefix.
      schema:
        type: string
        maxLength: 49
    - name: targetType
      in: query
      required: false
      description: Only records whose target is of this type.
      schema:
        $ref: '../../components/schemas/AuditTarget.yaml#/properties/type'
    - name: targetId
      in: query
      required: false
      description: |
        Only records whose target identifier equals this value. Domain names (targets `domain`,
        `domainFooter` and `mtaStsPolicy`) may be given in ASCII or Unicode form and any letter case.
        DKIM keys (`dkimKey`) match in that normalised form and, for an unused key that legacy stored
        under another spelling, also by that exact spelling. Without `targetType`, a domain name
        matches the records of the domain and of its footer.
      schema:
        type: string
        maxLength: 255
    - name: impersonatedAccount
      in: query
      required: false
      description: |
        Feature 007: only records written while this account (a mailbox address or a domain
        administrator's username, exact match after lower-casing) was impersonated, including the
        starts and ends of its impersonations.
      schema:
        type: string
        maxLength: 255
  responses:
    '200':
      $ref: '../../components/responses/AuditEventListResponse.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/Forbidden.yaml'
    '422':
      $ref: '../../components/responses/ValidationFailed.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
