get:
  operationId: getApiDocs
  tags: [System]
  summary: Interactive API documentation
  description: HTML page that renders `GET /openapi.yaml`. All assets are served by the API itself.
  security: []
  responses:
    '200':
      description: The documentation page.
      content:
        text/html:
          schema:
            type: string
    '500':
      $ref: '../../components/responses/InternalError.yaml'
