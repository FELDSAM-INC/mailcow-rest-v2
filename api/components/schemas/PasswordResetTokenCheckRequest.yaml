type: object
required: [token]
properties:
  token:
    type: string
    minLength: 1
    maxLength: 64
    writeOnly: true
    description: The token from the reset link (five groups of six hexadecimal characters joined by `-`).
    examples: [3F9A1C-0B7E22-9D4F10-A6C3E8-51B2D7]
additionalProperties: false
