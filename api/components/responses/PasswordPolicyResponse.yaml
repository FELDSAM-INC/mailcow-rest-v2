description: The current password policy.
headers:
  ETag:
    description: Version tag (strong ETag) of the effective policy values, equal to `data.etag` and to the tag feature 013 uses to change the policy.
    required: true
    schema:
      type: string
content:
  application/json:
    schema:
      type: object
      required: [data]
      properties:
        data:
          $ref: '../schemas/PasswordPolicy.yaml'
