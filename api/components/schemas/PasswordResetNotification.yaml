type: object
description: |
  The e-mail that self-service password reset (feature 005) sends (`PW_RESET_FROM`,
  `PW_RESET_SUBJ`, `PW_RESET_TEXT`, `PW_RESET_HTML`). Password reset is available only while both
  a sender and a subject are set: clearing either switches it off.

  Placeholders, replaced in the subject and both templates: `{{link}}` (the reset link; without it
  the e-mail is useless), `{{username}}` (the mailbox), `{{username2}}` (the recovery address),
  `{{date}}` (the request time), `{{token_lifetime}}` (minutes the link stays valid) and
  `{{hostname}}` (the server's host name).
required:
  - sender
  - subject
  - textTemplate
  - htmlTemplate
  - templatesAreDefault
  - passwordResetAvailable
  - etag
properties:
  sender:
    type: string
    description: Sender address. Empty when not set.
    examples: [no-reply@example.org]
  subject:
    type: string
    maxLength: 255
    description: Subject. Empty when not set.
  textTemplate:
    type: string
    description: Plain-text template, or mailcow's default when `templatesAreDefault` is `true`.
  htmlTemplate:
    type: string
    description: HTML template, or mailcow's default when `templatesAreDefault` is `true`.
  templatesAreDefault:
    type: boolean
    description: |
      `true` when both stored templates are empty, so that mailcow's default templates apply and
      are returned here.
  passwordResetAvailable:
    type: boolean
    description: '`true` when both `sender` and `subject` are set.'
  etag:
    type: string
    description: Version tag of the stored notification, equal to the `ETag` header.
