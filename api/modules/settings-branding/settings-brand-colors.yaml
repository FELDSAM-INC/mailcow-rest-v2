get:
  operationId: getBrandColors
  tags: [Branding settings]
  summary: Get the brand colours
  description: |
    Returns the stored light and dark brand colours and the colours in effect, with their
    foregrounds. The colours are stored by this API only; the legacy UI does not show them. Administrators only, by session or by an administrator's key, read-only keys included.
  security:
    - sessionCookie: []
    - apiKeyAuth: []
  responses:
    '200':
      $ref: '../../components/responses/BrandColorsResponse.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/Forbidden.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
    '503':
      $ref: '../../components/responses/SettingsTemporaryFailure.yaml'
patch:
  operationId: updateBrandColors
  tags: [Branding settings]
  summary: Change the brand colours
  description: |
    Sets or clears (`null`) the light and dark brand colours. Any six-digit sRGB colour is accepted
    and stored in lower case without adjusting its hue or brightness. Each effective colour includes
    a black or white foreground for readable button text. Clients derive a separate text-only accent
    against the reference surfaces in settings capabilities; surface contrast does not block saving.
    Clearing both returns the web app to its own palette. Refused in demo mode. Audited with the
    old and new colours. The colours in effect appear in the public configuration on its next read.
  security:
    - sessionCookie: []
      csrfToken: []
    - apiKeyAuth: []
  parameters:
    - $ref: '../../components/parameters/IfMatch.yaml'
  requestBody:
    required: true
    content:
      application/merge-patch+json:
        schema:
          $ref: '../../components/schemas/BrandColorsPatch.yaml'
  responses:
    '200':
      $ref: '../../components/responses/BrandColorsResponse.yaml'
    '400':
      $ref: '../../components/responses/BadRequest.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/BrandingForbidden.yaml'
    '412':
      $ref: '../../components/responses/PreconditionFailed.yaml'
    '415':
      $ref: '../../components/responses/UnsupportedMediaType.yaml'
    '422':
      $ref: '../../components/responses/ValidationFailed.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
    '503':
      $ref: '../../components/responses/SettingsTemporaryFailure.yaml'
