parameters:
  - $ref: '../../components/parameters/PolicyTargetDomain.yaml'
  - $ref: '../../components/parameters/SpamPolicyEntryId.yaml'
get:
  operationId: getDomainSpamPolicyEntry
  tags: [Spam policy]
  summary: Read one allow or block list entry of a domain
  description: |
    Returns one entry that belongs to a domain. An entry of another owner answers `404`, even when it is
    shown read-only in this owner's list.
  security:
    - sessionCookie: []
    - apiKeyAuth: []
  responses:
    '200':
      $ref: '../../components/responses/SpamPolicyEntryResponse.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/SpamFilterForbidden.yaml'
    '404':
      $ref: '../../components/responses/NotFound.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
delete:
  operationId: deleteDomainSpamPolicyEntry
  tags: [Spam policy]
  summary: Remove an allow or block list entry of a domain
  description: |
    Removes the entry through its owner. An entry of another owner, such as a domain entry
    addressed through one of its mailboxes, answers `404`. Administrators may always remove; domain administrators need `spamPolicy`; mailbox users are refused (`forbidden`). The spam filter stops applying it
    within one refresh of its settings map (at most 1 minute). Audited on the owner (audit
    target `domain`), with the entry's `entryId`, `list` and `pattern` in the details.
  security:
    - sessionCookie: []
      csrfToken: []
    - apiKeyAuth: []
  parameters:
    - $ref: '../../components/parameters/IfMatch.yaml'
  responses:
    '204':
      $ref: '../../components/responses/NoContent.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/SpamFilterForbidden.yaml'
    '404':
      $ref: '../../components/responses/NotFound.yaml'
    '412':
      $ref: '../../components/responses/PreconditionFailed.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
