type: object
description: What the holder of a valid reset token needs to choose a new password.
required: [address, expiresAt, passwordPolicy, secondFactorRequired, secondFactorMethods]
properties:
  address:
    type: string
    description: The mailbox whose password will be reset.
  expiresAt:
    type: string
    format: date-time
  passwordPolicy:
    $ref: './PasswordPolicy.yaml'
  secondFactorRequired:
    type: boolean
    description: |
      The account has active second factors, so the completion must carry one. When `true` and
      `secondFactorMethods` is empty, the account's only entries are deprecated ones and the reset
      cannot be completed here (`second-factor-unavailable`).
  secondFactorMethods:
    type: array
    description: The account's usable second factors in the recommended order (feature 001).
    items:
      $ref: './SecondFactorMethod.yaml'
