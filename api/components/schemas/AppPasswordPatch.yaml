type: object
description: |
  JSON Merge Patch of an app password. Only the members sent change; the mailbox never changes.
  Send `password` to set a password, or `generatePassword: true` to have one generated and returned
  once; not both. At least one member is required (`required` on `body`).
properties:
  name:
    type: string
    minLength: 1
    maxLength: 255
  password:
    type: string
    minLength: 1
    maxLength: 4096
    writeOnly: true
  generatePassword:
    type: boolean
    const: true
  protocols:
    type: array
    uniqueItems: true
    items:
      $ref: './AppPasswordProtocol.yaml'
  active:
    type: boolean
additionalProperties: false
