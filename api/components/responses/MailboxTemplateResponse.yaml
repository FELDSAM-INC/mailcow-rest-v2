description: One mailbox template.
headers:
  ETag:
    description: Version tag (strong ETag) of the template, equal to `data.etag`. Send it in `If-Match` when changing or deleting the template.
    required: true
    schema:
      type: string
content:
  application/json:
    schema:
      type: object
      required: [data]
      properties:
        data:
          $ref: '../schemas/MailboxTemplate.yaml'
