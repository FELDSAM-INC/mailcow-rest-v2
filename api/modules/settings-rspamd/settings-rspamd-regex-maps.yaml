get:
  operationId: listRspamdRegexMaps
  tags: [Rspamd settings]
  summary: List the global regex maps
  description: |
    Lists the global regex maps that the operator's configuration makes editable (13 by default,
    from "Header-From: Denylist" to "Monitoring Hosts"), each with its content and version tag. A
    map whose file is missing on this server is listed with `available: false`. `q` searches the name.
    Administrators only, by session or by an administrator's key, read-only keys included.
  security:
    - sessionCookie: []
    - apiKeyAuth: []
  parameters:
    - $ref: '../../components/parameters/Limit.yaml'
    - $ref: '../../components/parameters/Offset.yaml'
    - $ref: '../../components/parameters/RspamdRegexMapSort.yaml'
    - $ref: '../../components/parameters/Order.yaml'
    - $ref: '../../components/parameters/Search.yaml'
  responses:
    '200':
      $ref: '../../components/responses/RspamdRegexMapListResponse.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/Forbidden.yaml'
    '422':
      $ref: '../../components/responses/ValidationFailed.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
