description: The mailbox was renamed. Every step completed.
headers:
  Content-Location:
    description: Absolute path of the mailbox under its new address.
    required: true
    schema:
      type: string
      format: uri-reference
  ETag:
    description: Version tag (strong ETag) of the renamed mailbox, equal to `data.etag`.
    required: true
    schema:
      type: string
content:
  application/json:
    schema:
      type: object
      required: [data]
      properties:
        data:
          $ref: '../schemas/MailboxRenamed.yaml'
