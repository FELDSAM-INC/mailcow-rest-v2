description: One quarantine item with the spam filter's results and the parsed content.
headers:
  ETag:
    description: Version tag (strong ETag) of the resource, equal to `data.etag`. Send it in `If-Match` with a change.
    required: true
    schema:
      type: string
content:
  application/json:
    schema:
      type: object
      required: [data]
      properties:
        data:
          $ref: '../schemas/QuarantineItemDetails.yaml'
