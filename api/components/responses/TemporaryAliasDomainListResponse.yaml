description: Domains available for the mailbox's temporary aliases, the mailbox's domain first, then its alias domains by name.
content:
  application/json:
    schema:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '../schemas/TemporaryAliasDomain.yaml'
        meta:
          $ref: '../schemas/ListMeta.yaml'
