post:
  operationId: createPasswordResetWebAuthnChallenge
  tags: [Password reset]
  summary: Get a WebAuthn challenge for a reset
  description: |
    For an account with WebAuthn second factors, issues a single-use challenge bound to the valid
    token and to this browser session, to be answered in `POST /password-resets/completion`. It
    expires after 5 minutes or at the first completion attempt; a new request replaces it.
    Throttled with the token checks.
  security:
    - sessionCookie: []
      csrfToken: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/PasswordResetWebAuthnChallengeRequest.yaml'
  responses:
    '200':
      $ref: '../../components/responses/WebAuthnChallengeResponse.yaml'
    '400':
      $ref: '../../components/responses/PasswordResetRejected.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/PasswordResetForbidden.yaml'
    '422':
      $ref: '../../components/responses/ValidationFailed.yaml'
    '429':
      $ref: '../../components/responses/TooManyRequests.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
