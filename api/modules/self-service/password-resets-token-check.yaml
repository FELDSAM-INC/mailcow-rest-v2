post:
  operationId: checkPasswordResetToken
  tags: [Password reset]
  summary: Check a reset token
  description: |
    Checks the token from a reset link (sent in the body, never in the URL) and returns the account
    address, the expiry, the password rules and the account's second factors. Tokens issued by the
    legacy reset page work too. Changes nothing. Throttled per client address (10 checks in 15
    minutes by default). For browser sessions with the anti-forgery token.
  security:
    - sessionCookie: []
      csrfToken: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/PasswordResetTokenCheckRequest.yaml'
  responses:
    '200':
      $ref: '../../components/responses/PasswordResetTokenInfoResponse.yaml'
    '400':
      $ref: '../../components/responses/PasswordResetRejected.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/PasswordResetForbidden.yaml'
    '415':
      $ref: '../../components/responses/UnsupportedMediaType.yaml'
    '422':
      $ref: '../../components/responses/ValidationFailed.yaml'
    '429':
      $ref: '../../components/responses/TooManyRequests.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
