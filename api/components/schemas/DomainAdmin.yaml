type: object
description: |
  A domain administrator account (mailcow table `admin`, `superadmin = 0`) with its assigned
  domains and permission flags. Accounts without any assignment are included and shown with an
  empty `domains` list. Passwords and password hashes are never returned.
required:
  - username
  - active
  - forcePasswordChange
  - forceSecondFactorSetup
  - secondFactorStatus
  - activePasskeyCount
  - createdAt
  - modifiedAt
  - domains
  - permissions
  - etag
properties:
  username:
    type: string
    maxLength: 255
    description: Username as stored. Addressed in paths in any letter case.
    examples: [reseller1]
  active:
    type: boolean
    description: |
      The account's own status. Inactive accounts cannot sign in, and their API keys are refused
      until reactivated. Changing it also changes the status of every assignment.
  forcePasswordChange:
    type: boolean
    description: The account must change its password at its next sign-in (mailcow attribute `force_pw_update`).
  forceSecondFactorSetup:
    type: boolean
    description: The account must set up a second factor at its next sign-in when it has none (mailcow attribute `force_tfa`).
  secondFactorStatus:
    $ref: './AccountSecondFactorStatus.yaml'
  activePasskeyCount:
    type: integer
    minimum: 0
  createdAt:
    type: string
    format: date-time
  modifiedAt:
    description: Last change of the account row, `null` when never modified. Assignment and permission changes do not update it.
    oneOf:
      - type: string
        format: date-time
      - type: 'null'
  domains:
    type: array
    description: Assignments, ordered by domain.
    items:
      $ref: './DomainAdminAssignment.yaml'
  permissions:
    $ref: './DomainAdminPermissions.yaml'
  etag:
    type: string
    description: |
      Version tag of the stored settings (username, status, forced flags, assignments and
      permission flags; not the second-factor status or the passkey count), equal to the `ETag`
      header of a single read. Send it in `If-Match` when changing or deleting the account, and as
      `version` in bulk actions.
