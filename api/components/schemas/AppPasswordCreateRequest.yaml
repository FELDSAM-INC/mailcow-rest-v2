type: object
required: [name]
properties:
  name:
    type: string
    minLength: 1
    maxLength: 255
    description: Trimmed; its stored (HTML-encoded) form must fit 255 characters.
  password:
    type: string
    minLength: 1
    maxLength: 4096
    writeOnly: true
    description: |
      Omit to let the system generate 32 random characters that meet the password policy, returned
      once as `generatedPassword`. A given password must meet the policy and must not start with a
      hash-scheme prefix, and is never returned.
  protocols:
    type: array
    uniqueItems: true
    items:
      $ref: './AppPasswordProtocol.yaml'
    description: Default all six. An empty list is accepted; such an app password works nowhere.
  active:
    type: boolean
    default: true
additionalProperties: false
