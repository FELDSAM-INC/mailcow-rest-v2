post:
  operationId: validateSieveScript
  tags: [Sieve filters]
  summary: Validate a Sieve script
  description: |
    Checks a script with the same Sieve parser legacy mailcow uses, without saving anything, and
    says whether it is valid, with the parser's message when it is not. It changes nothing, so it
    counts as a read: read-only keys may use it. Administrators and domain administrators; mailbox
    users get `forbidden`.
  security:
    - sessionCookie: []
      csrfToken: []
    - apiKeyAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/SieveScriptValidationRequest.yaml'
  responses:
    '200':
      $ref: '../../components/responses/SieveScriptValidationResponse.yaml'
    '400':
      $ref: '../../components/responses/BadRequest.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/SelfServiceForbidden.yaml'
    '422':
      $ref: '../../components/responses/ValidationFailed.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
