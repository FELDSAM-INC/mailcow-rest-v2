type: object
additionalProperties: false
required:
- id
- description
- prefix
- accessLevel
- allowedNetworks
- skipIpCheck
- active
- service
- etag
- secret
properties:
  id:
    type: integer
    minimum: 1
  description:
    type: string
    maxLength: 255
  prefix:
    type: string
    description: First six characters; the full key is only returned on creation or
      regeneration.
  accessLevel:
    type: string
    enum:
    - readOnly
    - readWrite
  allowedNetworks:
    type: array
    maxItems: 100
    items:
      type: string
      maxLength: 49
  skipIpCheck: &id001
    type: boolean
  active: *id001
  service:
    type: boolean
    description: Managed by mailcow.conf. Cannot be changed, regenerated or deleted
      here.
  etag:
    type: string
  secret:
    type: string
    description: Copy this value now; subsequent reads never return it.
