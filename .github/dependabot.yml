version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      ci-actions:
        patterns: ['*']
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      compatible-packages:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /docker/php
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Keep asset builds on the Node 22 line used by CI. Review runtime migrations separately.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
