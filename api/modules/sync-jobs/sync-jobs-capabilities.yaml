get:
  operationId: getSyncJobCapabilities
  tags: [Sync jobs]
  summary: Get sync-job capabilities
  description: |
    Returns what a client needs before it submits a sync job, as configured on this server for the
    caller: whether custom imapsync parameters are allowed for the caller and the allow-list in
    effect (never containing `showpasswords`), the bulk limit, the page sizes, every field's limits,
    the allowed encryption values and the creation defaults. Changes nothing; read-only keys may use
    it. Requires the sync-jobs permission (`403 forbidden` otherwise).
  security:
    - sessionCookie: []
    - apiKeyAuth: []
  responses:
    '200':
      $ref: '../../components/responses/SyncJobCapabilitiesResponse.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/Forbidden.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
