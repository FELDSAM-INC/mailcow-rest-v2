# Dev stack of mailcow REST API v2 (research R1). Every PHP, Composer and Node command runs in
# the `app` container, for example `docker compose run --rm app composer test`.
#
# MariaDB and Redis publish no host ports. The API is served by `web` on
# https://127.0.0.1:${RESTV2_WEB_TLS_PORT:-18443}/api/v2/ (self-signed certificate, `curl -k`) and
# on http://127.0.0.1:${RESTV2_WEB_PORT:-18080}/api/v2/ (health checks; the Secure session cookie
# needs HTTPS).
name: restv2

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    # Run as the host user so that files written to the bind mount (vendor/, build/, storage/)
    # stay owned by the developer. The production image runs as www-data (uid 82).
    user: "${RESTV2_UID:-1000}:${RESTV2_GID:-1000}"
    volumes:
      - .:/app
      - dev-home:/home/dev
    # Connection settings shared by the dev (.env) and test (.env.testing) environments, also
    # used by the shell scripts. DBNAME, REDIS_DB and APP_ENV are deliberately not set here:
    # Laravel reads them from .env or .env.testing, so tests never touch the dev database.
    environment:
      DBHOST: mariadb
      DBUSER: mailcow
      DBPASS: mailcow
      DBROOT: root
      REDISHOST: redis
      REDISPASS: ${REDISPASS:-devredispass}
    networks:
      default:
        aliases:
          - restv2-mailcow
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${RESTV2_WEB_PORT:-18080}:80"
      - "127.0.0.1:${RESTV2_WEB_TLS_PORT:-18443}:443"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/dev-tls.conf:/etc/nginx/conf.d/dev-tls.conf:ro
      - ./deploy/nginx/site.restv2.custom:/etc/nginx/conf.d/site.restv2.custom:ro
      - dev-certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_started
      certs:
        condition: service_completed_successfully

  # One-shot: the self-signed certificate of the HTTPS listener, generated with PHP's openssl
  # extension into the volume dev-certs when it does not exist yet. Never committed.
  certs:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    user: "0:0"
    command: ["php", "/generate-dev-certificate.php", "/certs"]
    volumes:
      - ./scripts/dev/generate-dev-certificate.php:/generate-dev-certificate.php:ro
      - dev-certs:/certs
    restart: "no"

  mariadb:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mailcow
      MYSQL_USER: mailcow
      MYSQL_PASSWORD: mailcow
      MYSQL_INITDB_SKIP_TZINFO: "1"
      # mailcow stores local time (TZ) in DATETIME columns; the same zone as .env.testing makes
      # the tests exercise the conversion to UTC.
      TZ: Europe/Prague
    volumes:
      - ./docker/mariadb/mailcow.cnf:/etc/mysql/conf.d/mailcow.cnf:ro
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7.4.11-alpine
    command: redis-server --requirepass ${REDISPASS:-devredispass}
    environment:
      TZ: Europe/Prague

  # Feature 012, profile `idp` (`docker compose --profile idp up -d`): identity providers for the
  # LDAP integration tests (`vendor/bin/phpunit --group idp`) and the manual single sign-on checks
  # of quickstart Part B. Not started by default.
  #
  # OpenLDAP: dc=example,dc=org, administrator cn=admin,dc=example,dc=org / ldap-secret, LDAPS on
  # 636 and StartTLS with a self-signed certificate, the people of tests/fixtures/ldap/bootstrap.ldif.
  # Reached by the app container as `openldap`; no host port.
  openldap:
    image: osixia/openldap:1.5.0
    profiles: [idp]
    command: --copy-service
    environment:
      LDAP_ORGANISATION: Example
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: ldap-secret
      LDAP_TLS: "true"
      LDAP_TLS_VERIFY_CLIENT: never
    volumes:
      - ./tests/fixtures/ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bootstrap.ldif:ro

  # Keycloak, for the manual single sign-on checks (API gap G21; admin admin / admin). It imports
  # docker/keycloak/example-realm.json: realm `example`, confidential client `mailcow` (secret
  # kc-secret, service account with view-users, a `mailcow_template` claim, the dev stack's return
  # addresses) and the user anna@example.org (password Passw0rd!dev, mailcow_template staff,
  # mailcow_password for the mailpassword flow). The app container reaches it as
  # http://keycloak:8080, the browser on the published port.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    profiles: [idp]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/keycloak/example-realm.json:/opt/keycloak/data/import/example-realm.json:ro
    ports:
      - "127.0.0.1:${RESTV2_KEYCLOAK_PORT:-8081}:8080"

  # Optional SMTP test target of feature 009's connection tests (quickstart Part B, research R24):
  # `docker compose --profile routing up -d mailpit`. SMTP on mailpit:1025 inside the stack (any
  # login is accepted, also without TLS), web UI on http://127.0.0.1:8025. MIT licensed.
  mailpit:
    image: axllent/mailpit:v1.27.10
    profiles: [routing]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  dev-home:
  mariadb-data:
  dev-certs:
