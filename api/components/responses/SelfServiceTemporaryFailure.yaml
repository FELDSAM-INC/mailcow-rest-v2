description: |
  A service the operation needs is temporarily unavailable (type `/api/v2/problems/temporary-failure`,
  extension `dependency`), or, for Yubico OTP, the Yubico service could not be reached (type
  `/api/v2/problems/temporary-verification-failure`). Nothing was changed. Retry later.
headers:
  Retry-After:
    description: Seconds after which a retry makes sense.
    required: true
    schema:
      type: integer
      minimum: 1
content:
  application/problem+json:
    schema:
      anyOf:
        - $ref: '../schemas/SelfServiceTemporaryFailureProblem.yaml'
        - $ref: '../schemas/Problem.yaml'
