type: object
description: |
  JSON Merge Patch of a relayhost. Omitted members stay unchanged. An omitted `password` is kept;
  `""` removes it. Setting `username` to `""` without a password also removes the password. A
  password together with an empty resulting username is refused. `id`, `usage`, `passwordSet` and
  `etag` are read-only: they are accepted with their current value and refused (`immutable`)
  otherwise, so that a client can send back the representation it read. Any other member is
  refused (`immutable`).
minProperties: 1
properties:
  host:
    type: string
    minLength: 1
    maxLength: 255
    description: Same rules as at creation.
  username:
    type: string
    maxLength: 255
  password:
    type: string
    format: password
    writeOnly: true
    maxLength: 255
  active:
    type: boolean
  id:
    type: integer
    description: Read-only.
  usage:
    type: object
    description: Read-only.
  passwordSet:
    type: boolean
    description: Read-only.
  etag:
    type: string
    description: Read-only.
