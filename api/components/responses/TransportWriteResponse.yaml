description: |
  The updated transport. `meta.affectedTransports` lists the other transports whose stored
  credentials the request changed (empty when none).
headers:
  ETag:
    description: Version tag (strong ETag) of the resource's stored settings, equal to `data.etag`. Send it in `If-Match` when changing the resource.
    required: true
    schema:
      type: string
content:
  application/json:
    schema:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '../schemas/Transport.yaml'
        meta:
          type: object
          required: [affectedTransports]
          properties:
            affectedTransports:
              type: array
              items:
                $ref: '../schemas/TransportReference.yaml'
