description: |
  The impersonation started. The session identifier and the anti-forgery token were renewed; the
  new token is in `data.csrfToken`.
headers:
  Location:
    description: Absolute path of the created resource.
    required: true
    schema:
      type: string
      format: uri-reference
content:
  application/json:
    schema:
      type: object
      required: [data]
      properties:
        data:
          $ref: '../schemas/ImpersonationStarted.yaml'
