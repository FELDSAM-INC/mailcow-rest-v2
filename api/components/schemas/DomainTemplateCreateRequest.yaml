type: object
description: |
  A new domain template. Only `name` is required. Omitted values get the legacy defaults: 10
  mailboxes, 400 aliases, 3,072 MiB default and 10,240 MiB maximum mailbox quota, 10,240 MiB domain
  quota, no rate limit, active, Global Address List on, no relay options, no tags, the server's
  default DKIM selector and 2,048-bit keys. Sent values, including zero, are kept when valid.

  The values follow the domain rules, so that a template always produces a valid domain: quotas
  are whole multiples of 1 MiB, `defaultMailboxQuota` ≤ `maxMailboxQuota` ≤ `domainQuota`, tags as
  for domains, and the relay options are normalised. The name must be unique among domain
  templates, compared case-insensitively (`409 domain-template-name-exists`).
required: [name]
properties:
  name:
    type: string
    minLength: 1
    maxLength: 255
  tags:
    $ref: './DomainTagList.yaml'
  maxMailboxes:
    type: integer
    minimum: 0
    maximum: 2147483647
  maxAliases:
    type: integer
    minimum: 0
    maximum: 2147483647
  defaultMailboxQuota:
    type: integer
    minimum: 1048576
    maximum: 9007199254740992
  maxMailboxQuota:
    type: integer
    minimum: 1048576
    maximum: 9007199254740992
  domainQuota:
    type: integer
    minimum: 1048576
    maximum: 9007199254740992
  rateLimit:
    oneOf:
      - $ref: './DomainRateLimit.yaml'
      - type: 'null'
  active:
    type: boolean
  globalAddressList:
    type: boolean
  backupMx:
    type: boolean
  relayAllRecipients:
    type: boolean
  relayUnknownOnly:
    type: boolean
  dkimSelector:
    type: string
    maxLength: 255
    pattern: '^[A-Za-z0-9._-]*$'
  dkimKeySize:
    type: integer
    enum: [1024, 2048, 3072, 4096]
