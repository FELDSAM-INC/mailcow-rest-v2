type: object
description: |
  JSON Merge Patch of the brand colours. Any six-digit hexadecimal sRGB colour
  (`#RRGGBB`, either letter case) is accepted without adjustment; `null` clears it.
  Contrast against a theme's surface does not restrict the chosen accent.
minProperties: 1
additionalProperties: false
properties:
  light:
    oneOf:
      - type: string
        pattern: '^#[0-9A-Fa-f]{6}$'
      - type: 'null'
  dark:
    oneOf:
      - type: string
        pattern: '^#[0-9A-Fa-f]{6}$'
      - type: 'null'
