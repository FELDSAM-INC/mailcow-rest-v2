parameters:
  - $ref: '../../components/parameters/Oauth2ClientId.yaml'
post:
  operationId: regenerateOauth2ClientSecret
  tags: [OAuth2 clients]
  summary: Generate a new client secret
  description: |
    Replaces the secret with a new one of 24 lowercase hexadecimal characters, returned only in this
    response. Existing access tokens, refresh tokens and authorization codes are kept, but renewing
    a token or exchanging a code with the old secret fails, as legacy documents. Administrators
    only, with a session or a read-write key. Audited without the secret. No bulk form exists.
  security:
    - sessionCookie: []
      csrfToken: []
    - apiKeyAuth: []
  parameters:
    - $ref: '../../components/parameters/IfMatch.yaml'
  responses:
    '200':
      $ref: '../../components/responses/Oauth2ClientSecretResponse.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/Forbidden.yaml'
    '404':
      $ref: '../../components/responses/NotFound.yaml'
    '412':
      $ref: '../../components/responses/PreconditionFailed.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
