parameters:
  - $ref: '../../components/parameters/QuarantineItemId.yaml'
  - $ref: '../../components/parameters/QuarantineAttachmentPosition.yaml'
get:
  operationId: downloadQuarantineAttachment
  tags: [Quarantine]
  summary: Download one attachment of a quarantined message
  description: |
    Returns the decoded attachment at `position` as a file to save, never to display. Allowed for
    administrators, domain administrators, and mailbox users with `quarantine_attachments`
    (`permission-flag-required` with `flag: quarantine_attachments` otherwise). An unknown position answers `404`. A message larger
    than the content size limit is refused with `409 quarantine-message-too-large`. Read-only keys
    may download. Not audited.
  security:
    - sessionCookie: []
    - apiKeyAuth: []
  responses:
    '200':
      $ref: '../../components/responses/QuarantineAttachmentDownload.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../../components/responses/SpamFilterForbidden.yaml'
    '404':
      $ref: '../../components/responses/NotFound.yaml'
    '409':
      $ref: '../../components/responses/QuarantineConflict.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
