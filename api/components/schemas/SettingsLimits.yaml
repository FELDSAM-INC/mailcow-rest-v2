type: object
description: Field limits of the system settings. Sizes are bytes of UTF-8, lengths are characters.
required:
  - singleLineTextMaxLength
  - htmlTextMaxLength
  - templateMaxBytes
  - rspamdRuleContentMaxBytes
  - rspamdRegexMapMaxBytes
  - sieveScriptMaxBytes
  - appLinksMax
  - quotaNotificationRecipientsMax
  - corsOriginsMax
  - passwordPolicyMinLength
  - passwordPolicyMaxLength
  - rspamdUiPasswordMinLength
  - rspamdUiPasswordMaxLength
  - defaultPageSize
  - maxPageSize
properties:
  singleLineTextMaxLength:
    type: integer
    description: Page title, product name, apps heading, subjects, rule descriptions and app link names.
    examples: [255]
  htmlTextMaxLength:
    type: integer
    description: Login help text, footer and announcement text.
    examples: [65535]
  templateMaxBytes:
    type: integer
    description: Password reset and quota notification templates.
    examples: [1048576]
  rspamdRuleContentMaxBytes:
    type: integer
    examples: [1048576]
  rspamdRegexMapMaxBytes:
    type: integer
    examples: [1048576]
  sieveScriptMaxBytes:
    type: integer
    examples: [1048576]
  appLinksMax:
    type: integer
    examples: [50]
  quotaNotificationRecipientsMax:
    type: integer
    examples: [100]
  corsOriginsMax:
    type: integer
    examples: [100]
  passwordPolicyMinLength:
    type: integer
    description: Smallest minimum password length an administrator may set.
    examples: [3]
  passwordPolicyMaxLength:
    type: integer
    description: Largest minimum password length an administrator may set.
    examples: [64]
  rspamdUiPasswordMinLength:
    type: integer
    examples: [6]
  rspamdUiPasswordMaxLength:
    type: integer
    examples: [256]
  defaultPageSize:
    type: integer
    examples: [25]
  maxPageSize:
    type: integer
    examples: [1000]
