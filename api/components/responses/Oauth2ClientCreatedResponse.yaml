description: The client was created. This and the secret regeneration are the only responses that contain the secret.
headers:
  Location:
    description: Absolute path of the created resource.
    required: true
    schema:
      type: string
      format: uri-reference
  ETag:
    description: Version tag (strong ETag) of the resource's stored settings, equal to `data.etag`. Send it in `If-Match` when changing the resource.
    required: true
    schema:
      type: string
content:
  application/json:
    schema:
      type: object
      required: [data]
      properties:
        data:
          $ref: '../schemas/Oauth2ClientWithSecret.yaml'
