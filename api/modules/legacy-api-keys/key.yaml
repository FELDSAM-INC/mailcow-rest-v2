parameters:
- in: path
  name: legacyKeyId
  required: true
  schema:
    type: integer
    minimum: 1
get:
  operationId: getLegacyApiKey
  tags:
  - API keys
  summary: Read legacy API key metadata
  description: Requires mailcow 2026-11. Administrator only. Writes require a browser
    session and CSRF. These keys authenticate the legacy /api/v1, independently of
    REST v2 owner-bound keys. Stored secrets are never returned by reads. Service
    keys are managed in mailcow.conf; all mutations on them return 409.
  security:
  - sessionCookie: []
  - apiKeyAuth: []
  responses:
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '403':
      $ref: ../../components/responses/Forbidden.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
    '412':
      $ref: ../../components/responses/PreconditionFailed.yaml
    '415':
      $ref: ../../components/responses/UnsupportedMediaType.yaml
    '422':
      $ref: ../../components/responses/ValidationFailed.yaml
    '500':
      $ref: ../../components/responses/InternalError.yaml
    '409':
      description: Unsupported schema, conflicting source state or unavailable provider.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/Problem.yaml
    '503':
      description: Unsupported schema, conflicting source state or unavailable provider.
      content:
        application/problem+json:
          schema:
            $ref: ../../components/schemas/Problem.yaml
    '200':
      description: The requested data.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - data
            properties:
              data:
                $ref: ../../components/schemas/LegacyApiKey.yaml
