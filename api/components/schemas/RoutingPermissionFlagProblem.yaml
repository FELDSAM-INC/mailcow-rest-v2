description: |
  Problem of type `/api/v2/problems/permission-flag-required` (status `403`): the caller is a domain
  administrator whose permission flags do not include one that the operation needs. Nothing changed.
allOf:
  - $ref: './PermissionFlagRequiredProblem.yaml'
  - type: object
    required: [requiredFlags]
    properties:
      requiredFlags:
        type: array
        minItems: 1
        description: The missing flags, named as in `PermissionFlags`.
        items:
          type: string
          enum: [domainRelayhost, mailboxRelayhost, bccMaps]
