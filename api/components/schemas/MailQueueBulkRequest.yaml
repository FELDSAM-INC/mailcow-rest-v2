type: object
description: |
  Between 1 and 1,000 queued messages. A queue ID named twice is processed once. More than 1,000
  IDs, or an ID that is not hexadecimal, refuses the whole request (`422`, rule `tooMany` with
  `max`, or `invalidFormat` with `format: queueId` on `items.<n>.id`) and nothing changes.
required: [items]
properties:
  items:
    type: array
    minItems: 1
    maxItems: 1000
    items:
      $ref: './MailQueueBulkTarget.yaml'
additionalProperties: false
