description: |
  Problem of type `/api/v2/problems/permission-flag-required` (status `403`): the caller's role
  may use the operation, but only with a permission flag (`user_acl` or `da_acl`) it lacks. Nothing
  was changed. When several flags are missing, `flag` names the first in the order `quarantine`,
  `quarantine_attachments`.
allOf:
  - $ref: './Problem.yaml'
  - type: object
    required: [flag]
    properties:
      flag:
        type: string
        description: |
          The missing flag, named as its legacy column. Feature 006 uses `quarantine`,
          `quarantine_attachments`, `spam_score`, `spam_policy` and `ratelimit`.
        examples: [quarantine, quarantine_attachments, spam_policy, ratelimit]
