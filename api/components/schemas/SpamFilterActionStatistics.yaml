type: object
description: |
  How many messages the spam filter (Rspamd) handled with each action since its statistics were
  last reset. Greylisted messages are counted as soft-rejected, as on the legacy dashboard.
required: [rejected, softRejected, subjectRewritten, movedToJunk, noAction, total, countedSince, spamFilterRunningSince]
properties:
  rejected: {type: integer, minimum: 0}
  softRejected:
    type: integer
    minimum: 0
    description: Soft-rejected plus greylisted messages.
  subjectRewritten: {type: integer, minimum: 0}
  movedToJunk:
    type: integer
    minimum: 0
    description: Messages delivered with the "add header" action, that is to the junk folder.
  noAction: {type: integer, minimum: 0}
  total:
    type: integer
    minimum: 0
    description: Sum of the five counts.
  countedSince:
    description: |
      Start of the counting period, when the spam filter reports it; `null` means unknown. Rspamd
      `2026-09a` does not report it.
    oneOf:
      - type: string
        format: date-time
      - type: 'null'
  spamFilterRunningSince:
    description: |
      Since when the spam filter has been running, derived from the uptime it reports, or `null`.
      The filter keeps its counters across restarts until they are reset, so the counting period
      may begin before this time.
    oneOf:
      - type: string
        format: date-time
      - type: 'null'
