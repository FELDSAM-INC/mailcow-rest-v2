type: object
additionalProperties: false
required:
- owner
- rights
- subscribe
- id
- state
- error
properties:
  owner:
    type: string
    format: email
  rights:
    type: string
    enum:
    - read
    - write
    - full
  subscribe:
    type: boolean
  id:
    type: integer
  state:
    type: string
    enum:
    - pending
    - applied
    - failed
    - removing
  error:
    type:
    - string
    - 'null'
