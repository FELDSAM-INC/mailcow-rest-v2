type: object
description: |
  Content parsed from the stored message. HTML is never returned: the HTML part is converted to
  plain text, so nothing in a message can run in a client. Clients still show every text as text.
required: [from, subject, recipients, textPlain, textFromHtml, parserFallback, attachments]
properties:
  from:
    type: string
    description: The `From` header, decoded to UTF-8. Empty when the message has none.
  subject:
    type: string
    description: The `Subject` header, decoded to UTF-8. Empty when the message has none.
  recipients:
    type: array
    description: Recipients named in the `To`, `Cc` and `Bcc` headers, followed by the envelope recipient.
    items:
      $ref: './QuarantineRecipient.yaml'
  textPlain:
    description: |
      The plain-text part, or `null` when the message has none or when no part could be extracted
      (`parserFallback`).
    oneOf:
      - type: string
      - type: 'null'
  textFromHtml:
    type: string
    description: |
      The HTML part converted to plain text. With `parserFallback`, the raw body converted to text.
      Empty when there is no HTML part.
  parserFallback:
    type: boolean
    description: |
      `true` when neither a plain-text nor an HTML part could be extracted, so `textFromHtml` holds
      the raw body converted to text and `textPlain` is `null` (legacy "Parser failed, assuming
      HTML").
  attachments:
    description: |
      The attachments, or `null` when the caller may not see attachment details (a mailbox user
      without the `quarantine_attachments` permission). An empty list means the message has none.
    oneOf:
      - type: array
        items:
          $ref: './QuarantineAttachment.yaml'
      - type: 'null'
