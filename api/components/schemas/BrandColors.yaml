type: object
description: |
  The brand colours stored by this API (not visible in the legacy UI), and the colours in effect.
  Brand fills preserve the chosen colour. Their foregrounds have at least 4.5:1 contrast;
  clients derive text-only link colours separately using the settings capability references.
required: [light, dark, effective, etag]
properties:
  light:
    description: Stored light-theme colour, lower case. `null` when not set.
    oneOf:
      - type: string
        pattern: '^#[0-9a-f]{6}$'
      - type: 'null'
    examples: ['#1d4ed8']
  dark:
    description: Stored dark-theme colour, lower case. `null` when not set.
    oneOf:
      - type: string
        pattern: '^#[0-9a-f]{6}$'
      - type: 'null'
  effective:
    $ref: './EffectiveBrandColors.yaml'
  etag:
    type: string
    description: Version tag of the stored colours, equal to the `ETag` header.
