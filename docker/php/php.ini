; mailcow REST API v2 PHP settings (research R1, R24).
expose_php = 0
memory_limit = 256M
display_errors = 0
log_errors = 1
error_log = /proc/self/fd/2
opcache.enable = 1
; Feature 013 (research R3): logo uploads of up to 15 MiB arrive as raw request bodies; the
; general limit of 5 MiB is nginx's (deploy/nginx/site.restv2.custom).
post_max_size = 20M
