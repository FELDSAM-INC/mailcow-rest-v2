description: An app password, with the password the system generated when it generated one.
allOf:
  - $ref: './AppPassword.yaml'
  - type: object
    required: [generatedPassword]
    properties:
      generatedPassword:
        oneOf:
          - type: string
            minLength: 32
          - type: 'null'
        description: |
          The generated password, shown exactly once, in this response only. `null` when the client
          gave the password or did not change it.
