description: |
  The reset step was refused. Possible types:
  - `/api/v2/problems/invalid-reset-token`: the token is unknown, expired, already used, or belongs
    to a mailbox that is no longer active or no longer uses the mailcow source. Request a new reset.
  - `about:blank`: malformed JSON.
content:
  application/problem+json:
    schema:
      $ref: '../schemas/Problem.yaml'
    examples:
      invalidToken:
        value:
          type: /api/v2/problems/invalid-reset-token
          title: Invalid reset token
          status: 400
          detail: The reset link is invalid or expired.
          requestId: 4bf92f3577b34da6a3ce929d0e0e4736
